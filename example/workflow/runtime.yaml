workflow_name: summarize-runtime-example
nodes:
  - name: prepare
    type: function
    function: prepare_input
    routing: broadcast
  - name: summarize
    type: agent
    model:
      name: Qwen3-4B
    execution:
      model_path: /data/Models/Qwen/Qwen3-4B
      max_new_tokens: 512
      dtype: float16
      do_sample: false
      serving:
        max_model_len: 3072
        max_num_seqs: 3
        max_num_batched_tokens: 6144
        gpu_memory_utilization: 0.98
    prompt_template: "Summarize the prepared content: {content}"
edges:
  - source: prepare
    target: summarize
