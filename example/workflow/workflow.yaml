workflow_name: multimodal-tool-fanout-example
nodes:
  - name: prepare
    type: function
    function: prepare_multimodal_input
    description: Accepts a user request containing an image path and a text question.
    routing: broadcast

  - name: planner
    type: agent
    description: Understands the multimodal request and selects image, detection, text, or generation tool nodes when their outputs are useful.
    model:
      name: Qwen3-4B
    execution:
      model_path: /data/Models/Qwen/Qwen3-4B
      max_new_tokens: 64
      dtype: float16
      do_sample: false
      serving:
        max_model_len: 1024
        max_num_seqs: 1
        max_num_batched_tokens: 1024
    prompt_template: "Plan which tools to call for this request: {content}"

  - name: scene_classifier
    type: function
    function: scene_classifier
    description: Classifies the overall image scene and returns top classes, confidence scores, and accelerator execution metadata.
    parameters:
      model:
        task: image_classification
        name: mobilenetv2_100
        input_channels: 3
        output_classes: 1000
        image_size: [224, 224]
        width_multiplier: 1.0
      runtime:
        batch_size: 1
        input_shape: [1, 3, 224, 224]
        phase: inference

  - name: object_detector
    type: function
    function: object_detector
    description: Detects objects in the image and returns bounding boxes, class labels, confidence scores, and accelerator execution metadata.
    parameters:
      model:
        task: object_detection
        name: yolov8n
        input_channels: 3
        output_classes: 80
        image_size: [640, 640]
        depth_scale: 0.33
        width_scale: 0.25
        max_channels: 1024
        activation: silu
      runtime:
        batch_size: 1
        input_shape: [1, 3, 640, 640]
        phase: inference

  - name: text_intent_classifier
    type: function
    function: text_intent_classifier
    description: Classifies the user text intent and returns intent labels, confidence scores, and accelerator execution metadata.
    parameters:
      model:
        task: text_classification
        name: bert-base-uncased
        output_classes: 8
        vocab_size: 30522
        hidden_size: 768
        intermediate_size: 3072
        num_hidden_layers: 12
        num_attention_heads: 12
        max_position_embeddings: 512
      runtime:
        batch_size: 1
        sequence_length: 128
        phase: inference

  - name: evidence_writer
    type: agent
    description: Drafts a concise evidence summary from tool results when the final answer needs a short explanation.
    model:
      name: Qwen3-4B
    execution:
      model_path: /data/Models/Qwen/Qwen3-4B
      max_new_tokens: 64
      dtype: float16
      do_sample: false
      serving:
        max_model_len: 1024
        max_num_seqs: 1
        max_num_batched_tokens: 1024
    prompt_template: "Draft a concise evidence summary from these tool results: {content}"

  - name: summarizer
    type: agent
    description: Runs a local Qwen3 summarization variant to combine tool outputs into a concise evidence-backed answer draft.
    model:
      name: Qwen3-4B
    execution:
      model_path: /data/Models/Qwen/Qwen3-4B
      max_new_tokens: 256
      dtype: float16
      do_sample: false
      serving:
        max_model_len: 2048
        max_num_seqs: 1
        max_num_batched_tokens: 2048
    prompt_template: "Write the final evidence-backed answer: {content}"

edges:
  - source: prepare
    target: planner
  - source: planner
    target: scene_classifier
  - source: planner
    target: object_detector
  - source: planner
    target: text_intent_classifier
  - source: scene_classifier
    target: evidence_writer
  - source: object_detector
    target: evidence_writer
  - source: text_intent_classifier
    target: evidence_writer
  - source: evidence_writer
    target: summarizer
