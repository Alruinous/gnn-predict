defaults:
  prometheus_url: "http://192.168.5.60:31110"
  namespace: "crater-workspace"
  cpu_rate_window: "3s"
  query_step_seconds: 1
  memory_baseline_window_seconds: 5

targets:
  corex_resnet50_smoke:
    enabled: true
    # Replace with the JSON path printed by main.py.
    result_json: "output/corex_resnet50_smoke/results/REPLACE_WITH_RESULT_JSON.json"
    # Confirm the node on which the active Pod actually ran.
    node_name: "REPLACE_WITH_NODE_NAME"
    pod_name: "jpt-luoruian26-260928-01fe9-default0-0"
    gpu_backend: ix
    gpu_id: "0"
    # Read the UUID from ix_gpu_utilization{node_name="...",gpu="0"}.
    gpu_uuid: "REPLACE_WITH_GPU_UUID"
    output_csv: "output/corex_resnet50_smoke/monitor.csv"
