# BI-V150 monitoring targets. Run with --models NAME until every result_json
# has been replaced with the matching result file from a completed run.
# The Pod and UUID below belong to the newly reported container only. If a model
# runs in another Pod, replace its pod_name, node_name, gpu_id and gpu_uuid.
# The UUID has been matched to ix_gpu_utilization on inspur-01: physical gpu=1.
defaults:
  prometheus_url: "http://192.168.5.60:31110"
  namespace: "crater-workspace"
  cpu_rate_window: "30s"
  query_step_seconds: 1
  memory_baseline_window_seconds: 30
  min_phase_coverage_ratio: 0.8

targets:
  resnet50:
    enabled: true
    result_json: "output/resnet50/results/resnet50_variants_bi-v150_REPLACE_TIMESTAMP_results.json"
    node_name: "inspur-01"
    pod_name: "jpt-luoruian26-260929-fd7cd-default0-0"
    gpu_backend: ix
    gpu_id: "1"
    gpu_uuid: "GPU-f7e62b92-ddc0-53dd-969f-e3abfbe116e2"
    output_csv: "output/resnet50/monitor.csv"

  resnet:
    enabled: true
    result_json: "output/resnet/results/resnet_variants_bi-v150_REPLACE_TIMESTAMP_results.json"
    node_name: "inspur-01"
