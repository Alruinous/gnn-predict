defaults:
  prometheus_url: "http://192.168.5.60:31110"
  namespace: "crater-workspace"
  # Full ResNet50 variants measure each phase for at least 40 seconds.
  cpu_rate_window: "30s"
  query_step_seconds: 1
  memory_baseline_window_seconds: 30
  min_phase_coverage_ratio: 0.8

targets:
  resnet50:
    enabled: true
    # Replace with the result JSON from this completed 83-variant run.
    result_json: "output/resnet50/results/resnet50_variants_bi-v150_1790625930_results.json"
    # These labels belong to the previously verified Pod. Check that the
    # completed run used this same Pod, node and physical GPU UUID.
    node_name: "inspur-01"
    pod_name: "jpt-luoruian26-260928-01fe9-default0-0"
    gpu_backend: ix
    gpu_id: "7"
    gpu_uuid: "GPU-8241332d-37cb-5585-8482-a32f429b4bdc"
    output_csv: "output/resnet50/monitor.csv"
