  - name: chunk_0
    type: tool
    task: text_generation
    description: Summarize QMSum chunk 0 with Qwen3-0.6B.
    prompt_template: |-
      Summarize transcript details relevant to the query.
      Return only the partial answer summary.

      Query:
      {query}

      Transcript chunk:
      {chunk_0_text}
    model: &qwen06_model
      name: qwen3
      parameters:
        vocab_size: 151936
        hidden_size: 1024
        intermediate_size: 3072
        num_hidden_layers: 28
        num_attention_heads: 16
        num_key_value_heads: 8
        head_dim: 128
        max_position_embeddings: 40960
        tie_word_embeddings: true
    runtime: &weak_chunk_runtime
      batch_size: 1
      sequence_length: 8192
      decode_max_output_length: 256
      phase: decode
    execution: &weak_chunk_cuda0
      model_path: /data/Models/Qwen/Qwen3-0.6B
      devices:
        - cuda:0
      dtype: float16
      max_new_tokens: 256
      do_sample: false
      serving:
        max_model_len: 12288
        max_num_seqs: 3
        max_num_batched_tokens: 24576
        gpu_memory_utilization: 0.98
      use_chat_template: true
      enable_thinking: false
