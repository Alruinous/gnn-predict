nodes:
  - name: input
    type: input
  - name: summarizer
    type: tool
    task: text_generation
    description: Answer QMSum directly with Qwen3-32B.
    prompt_template: |-
      Answer the meeting summarization query using the transcript.
      Keep the answer concise, specific to the query, and grounded in the meeting.
      Return only the answer summary.

      Query:
      {query}

      Transcript:
      {input_text}
    model:
      name: qwen3
      parameters:
        vocab_size: 151936
        hidden_size: 5120
        intermediate_size: 25600
        num_hidden_layers: 64
        num_attention_heads: 64
        num_key_value_heads: 8
        head_dim: 128
        max_position_embeddings: 40960
        tie_word_embeddings: false
    runtime:
      batch_size: 1
      sequence_length: 2048
      decode_max_output_length: 512
      phase: decode
    execution:
      model_path: /data/Models/Qwen/Qwen3-32B
      devices:
        - cuda:0
        - cuda:1
        - cuda:2
      dtype: float16
      max_new_tokens: 512
      do_sample: false
      serving:
        max_model_len: 12288
        max_num_seqs: 3
        max_num_batched_tokens: 24576
        gpu_memory_utilization: 0.98
      use_chat_template: true
      enable_thinking: false
  - name: judge
    type: evaluator
    task: summary_llm_judge
  - name: output
    type: output
edges:
  - source: input
    target: summarizer
    attributes: {}
  - source: summarizer
    target: judge
    attributes: {}
  - source: judge
    target: output
    attributes: {}
