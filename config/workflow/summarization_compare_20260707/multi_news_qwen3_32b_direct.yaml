nodes:
  - name: summarizer
    type: agent
    task: text_generation
    description: Summarize Multi-News directly with Qwen3-32B.
    prompt_template: |-
      Summarize the related news documents into one concise multi-document summary.
      Cover the shared event, important distinct facts, and avoid unsupported details.
      Return only the summary.

      Documents:
      {input_text}
    model:
      name: qwen3
      parameters:
        vocab_size: 151936
        hidden_size: 5120
        intermediate_size: 25600
        num_hidden_layers: 64
        num_attention_heads: 64
        num_key_value_heads: 8
        head_dim: 128
        max_position_embeddings: 40960
        tie_word_embeddings: false
    runtime:
      batch_size: 1
      sequence_length: 8192
      decode_max_output_length: 512
      phase: decode
    execution:
      model_path: /data/Models/Qwen/Qwen3-32B
      devices:
        - cuda:0
        - cuda:1
        - cuda:2
      dtype: float16
      max_new_tokens: 512
      do_sample: false
      serving:
        max_model_len: 12288
        max_num_seqs: 3
        max_num_batched_tokens: 24576
        gpu_memory_utilization: 0.98
      use_chat_template: true
      enable_thinking: false
      model_name: Qwen3-32B
edges: []
