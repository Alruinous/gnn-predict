# dataset_replay experiment config (3 workflows, burst baseline).
# One workflow per dataset (qmsum1 + mbpp1 + gsm8k1); 40 sessions each = 120 total,
# matching the 2w/4w/8w convention (same total workload, redistributed).
# arrival_gap_sec=0 means burst (all sessions submitted at t=0).
timeout_sec: 3600
scenarios:
  - dataset: qmsum
    workflow_name: qmsum1
    dataset_path: dataset/QMSum/data/ALL
    sample_count: 40
    arrival_gap_sec: 0.0
  - dataset: mbpp
    workflow_name: mbpp1
    dataset_path: dataset/mbpp/sanitized-mbpp.json
    sample_count: 40
    arrival_gap_sec: 0.0
  - dataset: gsm8k
    workflow_name: gsm8k1
    dataset_path: dataset/gsm8k/data/test.jsonl
    sample_count: 40
    arrival_gap_sec: 0.0
