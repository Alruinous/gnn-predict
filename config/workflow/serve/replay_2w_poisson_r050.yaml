# Open-loop Poisson arrival, 2 workflows (qmsum1 + mbpp1).
# Aggregate offered load rho ~= 0.50 of measured burst saturation (~0.05 session/s);
# per-workflow lambda = 0.025/2 = 0.0125 session/s (mean inter-arrival ~80s).
# Same arrival_seed across policies => identical arrival trace (paired comparison).
# NOTE: lower rho => longer arrival window; total wall-clock ~= arrival window + drain.
timeout_sec: 5400
arrival_seed: 42
scenarios:
  - dataset: qmsum
    workflow_name: qmsum1
    dataset_path: dataset/QMSum/data/ALL
    sample_count: 60
    arrival_process: poisson
    arrival_rate_per_sec: 0.0125
  - dataset: mbpp
    workflow_name: mbpp1
    dataset_path: dataset/mbpp/sanitized-mbpp.json
    sample_count: 60
    arrival_process: poisson
    arrival_rate_per_sec: 0.0125
