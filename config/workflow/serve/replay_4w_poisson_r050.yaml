# Open-loop Poisson arrival, 4 workflows (qmsum1/qmsum2 + mbpp1/mbpp2).
# Aggregate offered load rho ~= 0.50 of measured burst saturation (~0.05 session/s);
# per-workflow lambda = 0.025/4 = 0.00625 session/s (mean inter-arrival ~160s).
# Each workflow is an independent Poisson stream (distinct trace_key => distinct seed).
# NOTE: lower rho => longer arrival window; total wall-clock ~= arrival window + drain.
timeout_sec: 5400
arrival_seed: 42
scenarios:
  - dataset: qmsum
    workflow_name: qmsum1
    dataset_path: dataset/QMSum/data/ALL
    sample_count: 30
    arrival_process: poisson
    arrival_rate_per_sec: 0.00625
  - dataset: qmsum
    workflow_name: qmsum2
    dataset_path: dataset/QMSum/data/ALL
    sample_count: 30
    arrival_process: poisson
    arrival_rate_per_sec: 0.00625
  - dataset: mbpp
    workflow_name: mbpp1
    dataset_path: dataset/mbpp/sanitized-mbpp.json
    sample_count: 30
    arrival_process: poisson
    arrival_rate_per_sec: 0.00625
  - dataset: mbpp
    workflow_name: mbpp2
    dataset_path: dataset/mbpp/sanitized-mbpp.json
    sample_count: 30
    arrival_process: poisson
    arrival_rate_per_sec: 0.00625
