# Open-loop Poisson arrival, 6 workflows (qmsum1/2 + mbpp1/2 + gsm8k1/2).
# Nominal aggregate session rate ~= 0.0375 session/s (rho~=0.75 vs the 2-dataset burst
# reference ~0.05), redistributed across 6 workflows: per-workflow lambda = 0.0375/6 = 0.00625.
# NOTE: gsm8k sessions are lighter, so true rho vs the 6-workflow burst-saturation is lower;
# recalibrate arrival_rate_per_sec after measuring a 6w burst-capacity.
# Same arrival_seed across policies => identical arrival trace (paired comparison).
timeout_sec: 5400
arrival_seed: 42
scenarios:
  - dataset: qmsum
    workflow_name: qmsum1
    dataset_path: dataset/QMSum/data/ALL
    sample_count: 20
    arrival_process: poisson
    arrival_rate_per_sec: 0.00625
  - dataset: qmsum
    workflow_name: qmsum2
    dataset_path: dataset/QMSum/data/ALL
    sample_count: 20
    arrival_process: poisson
    arrival_rate_per_sec: 0.00625
  - dataset: mbpp
    workflow_name: mbpp1
    dataset_path: dataset/mbpp/sanitized-mbpp.json
    sample_count: 20
    arrival_process: poisson
    arrival_rate_per_sec: 0.00625
  - dataset: mbpp
    workflow_name: mbpp2
    dataset_path: dataset/mbpp/sanitized-mbpp.json
    sample_count: 20
    arrival_process: poisson
    arrival_rate_per_sec: 0.00625
  - dataset: gsm8k
    workflow_name: gsm8k1
    dataset_path: dataset/gsm8k/data/test.jsonl
    sample_count: 20
    arrival_process: poisson
    arrival_rate_per_sec: 0.00625
  - dataset: gsm8k
    workflow_name: gsm8k2
    dataset_path: dataset/gsm8k/data/test.jsonl
    sample_count: 20
    arrival_process: poisson
    arrival_rate_per_sec: 0.00625
