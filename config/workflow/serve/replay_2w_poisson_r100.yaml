# Open-loop Poisson arrival, 2 workflows (qmsum1 + mbpp1).
# Aggregate offered load rho ~= 1.00 of measured burst saturation (~0.05 session/s);
# per-workflow lambda = 0.05/2 = 0.025 session/s (mean inter-arrival ~40s).
# Same arrival_seed across policies => identical arrival trace (paired comparison).
# At rho~=1 arrivals approach the drain rate: queues build, fewer idle lulls.
timeout_sec: 5400
arrival_seed: 42
scenarios:
  - dataset: qmsum
    workflow_name: qmsum1
    dataset_path: dataset/QMSum/data/ALL
    sample_count: 60
    arrival_process: poisson
    arrival_rate_per_sec: 0.025
  - dataset: mbpp
    workflow_name: mbpp1
    dataset_path: dataset/mbpp/sanitized-mbpp.json
    sample_count: 60
    arrival_process: poisson
    arrival_rate_per_sec: 0.025
