# Kairos's request ordering: shortest-remaining-critical-path first (SRPT).
# Only the ordering rule is taken; the Wasserstein/MDS priority embedding and the
# 0.5 s time-slot KV packing dispatcher are deliberately not implemented. For a
# non-negative distribution W1(P, delta_0) = E[X], so ordering by distance to Kairos's
# zero-latency anchor reduces to ordering by mean remaining latency, which is SRPT.
policy: kairos
acquire_timeout_sec: 1800.0
