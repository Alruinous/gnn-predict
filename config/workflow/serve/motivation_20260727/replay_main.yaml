# Main runs: 20 sessions per workflow at the pilot's arrival rate.
# The pilot (15 per workflow, same seed and rate) completed 45/45 with the system
# tracking the offered rate in steady state, so 0.025/s per workflow is loaded but
# stable rather than collapsed. poisson_arrival_offsets generates successive gaps from
# one seeded RNG, so a 20-session offset list extends the pilot's 15-session prefix.
timeout_sec: 7200
arrival_seed: 42
scenarios:
  - dataset: gsm8k
    workflow_name: moa_gsm8k
    dataset_path: dataset/gsm8k/data/test.jsonl
    sample_count: 20
    arrival_process: poisson
    arrival_rate_per_sec: 0.025
  - dataset: mbpp
    workflow_name: repair_mbpp
    dataset_path: dataset/mbpp/sanitized-mbpp.json
    sample_count: 20
    arrival_process: poisson
    arrival_rate_per_sec: 0.025
  - dataset: qmsum
    workflow_name: mapreduce_qmsum
    dataset_path: dataset/QMSum/data/ALL
    sample_count: 20
    arrival_process: poisson
    arrival_rate_per_sec: 0.025
