# Saturating load: the same 60 sessions as replay_eval.yaml, all offered at once.
#
# Under the Poisson config the arrival span (918s) is 86% of makespan (1073s), so
# makespan is pinned to the offered rate and cannot rank scheduling methods. With every
# session offered at t=0 the arrival term disappears and makespan is exactly how long
# the pool takes to drain the work, which is what a throughput claim needs. Backpressure
# on the entry queues throttles admission; submit_sessions runs one thread per session,
# so blocked submissions park rather than deadlock.
timeout_sec: 7200
arrival_seed: 42
scenarios:
  - dataset: gsm8k
    workflow_name: moa_gsm8k
    dataset_path: dataset/gsm8k/data/test.jsonl
    sample_count: 20
    arrival_process: burst
  - dataset: mbpp
    workflow_name: repair_mbpp
    dataset_path: dataset/mbpp/sanitized-mbpp.json
    sample_count: 20
    arrival_process: burst
  - dataset: qmsum
    workflow_name: chain_qmsum
    dataset_path: dataset/QMSum/data/ALL
    sample_count: 20
    arrival_process: burst
