# Evaluation runs: same scale and arrival parameters as replay_main.yaml, with the
# map-reduce QMSum workflow replaced by the rolling-chain one. Both draw on the same
# two models (4B chunks, 8B merge), so the five-model residency pressure is unchanged;
# what changes is that the chain variant exposes same-model one-to-one edges, which a
# chain-level scheduling unit can act on and a call-level one cannot.
timeout_sec: 7200
arrival_seed: 42
scenarios:
  - dataset: gsm8k
    workflow_name: moa_gsm8k
    dataset_path: dataset/gsm8k/data/test.jsonl
    sample_count: 20
    arrival_process: poisson
    arrival_rate_per_sec: 0.025
  - dataset: mbpp
    workflow_name: repair_mbpp
    dataset_path: dataset/mbpp/sanitized-mbpp.json
    sample_count: 20
    arrival_process: poisson
    arrival_rate_per_sec: 0.025
  - dataset: qmsum
    workflow_name: chain_qmsum
    dataset_path: dataset/QMSum/data/ALL
    sample_count: 20
    arrival_process: poisson
    arrival_rate_per_sec: 0.025
