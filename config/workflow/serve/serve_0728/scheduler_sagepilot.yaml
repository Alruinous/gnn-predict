# The full system, and the reference cell of the serve_0728 matrix: locality-first
# admission, near-ready prefetch, reuse-distance eviction and elastic replicas, with
# model lifecycle managed jointly across all registered workflows. Node fusion is a
# graph rewrite and is switched on separately with --fuse-nodes.
#
# elastic_replicas requires the cache policy: scale-out prices a new replica against
# the queue it would drain, which needs the frozen cache's run and load estimates, and
# _reload_cost returns None under fifo/kairos.
#
# acquire_timeout_sec is 1800 in every arm of this matrix and must stay that way: both
# _order_pending and _order_by_load_yield derive their starvation threshold from
# 0.5 * acquire_timeout_sec, so changing it silently retunes the cache policy's aging.
policy: cache
acquire_timeout_sec: 1800.0
elastic_replicas: true
max_replicas_per_model: 2
scale_out_margin_sec: 10.0
scale_in_idle_sec: 60.0
enable_prefetch: true
cross_workflow_lifecycle: true
# Anti-flap. Without it a pool whose device count equals its model count thrashes: one
# scale-out turns 5 residency claims on 5 devices into 6, and the homeless model then
# evicts someone else forever. Measured on 5 devices: 35 evictions, 74% of replicas
# gone inside 60s, median tenure 30s against loads costing 45-165s. Priced as a
# multiple of each replica's own measured load, so it needs no constant and scales
# from the 6.8s 0.6B load to the 257s 14B one.
min_residency_load_multiple: 1.0
