# Poisson arrival, 0.050 session/s per workflow. Arrival span ~460s — the saturated end,
# where the offered rate exceeds what the pool drains and queues build.
#
# Same arrival sequence as replay_poisson_r025 at double speed; see that file for why.
timeout_sec: 7200
arrival_seed: 42
scenarios:
  - dataset: gsm8k
    workflow_name: moa_gsm8k
    dataset_path: dataset/gsm8k/data/test.jsonl
    sample_count: 20
    arrival_process: poisson
    arrival_rate_per_sec: 0.050
  - dataset: mbpp
    workflow_name: repair_mbpp
    dataset_path: dataset/mbpp/sanitized-mbpp.json
    sample_count: 20
    arrival_process: poisson
    arrival_rate_per_sec: 0.050
  - dataset: qmsum
    workflow_name: chain_qmsum
    dataset_path: dataset/QMSum/data/ALL
    sample_count: 20
    arrival_process: poisson
    arrival_rate_per_sec: 0.050
