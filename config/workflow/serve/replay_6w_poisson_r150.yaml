# Open-loop Poisson arrival, 6 workflows (qmsum1/2 + mbpp1/2 + gsm8k1/2).
# Nominal aggregate session rate ~= 0.075 session/s (rho~=1.50 vs the 2-dataset burst
# reference), redistributed across 6 workflows: per-workflow lambda = 0.075/6 = 0.0125.
# NOTE: nominal rho vs the 2-dataset reference; the 3-dataset mix is lighter, recalibrate
# after a 6w burst-capacity measurement. Same arrival_seed across policies => paired trace.
timeout_sec: 5400
arrival_seed: 42
scenarios:
  - dataset: qmsum
    workflow_name: qmsum1
    dataset_path: dataset/QMSum/data/ALL
    sample_count: 20
    arrival_process: poisson
    arrival_rate_per_sec: 0.0125
  - dataset: qmsum
    workflow_name: qmsum2
    dataset_path: dataset/QMSum/data/ALL
    sample_count: 20
    arrival_process: poisson
    arrival_rate_per_sec: 0.0125
  - dataset: mbpp
    workflow_name: mbpp1
    dataset_path: dataset/mbpp/sanitized-mbpp.json
    sample_count: 20
    arrival_process: poisson
    arrival_rate_per_sec: 0.0125
  - dataset: mbpp
    workflow_name: mbpp2
    dataset_path: dataset/mbpp/sanitized-mbpp.json
    sample_count: 20
    arrival_process: poisson
    arrival_rate_per_sec: 0.0125
  - dataset: gsm8k
    workflow_name: gsm8k1
    dataset_path: dataset/gsm8k/data/test.jsonl
    sample_count: 20
    arrival_process: poisson
    arrival_rate_per_sec: 0.0125
  - dataset: gsm8k
    workflow_name: gsm8k2
    dataset_path: dataset/gsm8k/data/test.jsonl
    sample_count: 20
    arrival_process: poisson
    arrival_rate_per_sec: 0.0125
