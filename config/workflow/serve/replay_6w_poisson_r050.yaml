# Open-loop Poisson arrival, 6 workflows (qmsum1/2 + mbpp1/2 + gsm8k1/2).
# Nominal aggregate session rate ~= 0.025 session/s (parity with 2w r050 reference),
# redistributed across 6 workflows: per-workflow lambda = 0.025/6 ~= 0.004167 session/s.
# NOTE: gsm8k sessions are lighter, so true rho vs the 6-workflow burst-saturation is
# lower than 0.50; recalibrate arrival_rate_per_sec after a 6w burst-capacity measurement.
# Same arrival_seed across policies => identical arrival trace (paired comparison).
timeout_sec: 5400
arrival_seed: 42
scenarios:
  - dataset: qmsum
    workflow_name: qmsum1
    dataset_path: dataset/QMSum/data/ALL
    sample_count: 20
    arrival_process: poisson
    arrival_rate_per_sec: 0.004167
  - dataset: qmsum
    workflow_name: qmsum2
    dataset_path: dataset/QMSum/data/ALL
    sample_count: 20
    arrival_process: poisson
    arrival_rate_per_sec: 0.004167
  - dataset: mbpp
    workflow_name: mbpp1
    dataset_path: dataset/mbpp/sanitized-mbpp.json
    sample_count: 20
    arrival_process: poisson
    arrival_rate_per_sec: 0.004167
  - dataset: mbpp
    workflow_name: mbpp2
    dataset_path: dataset/mbpp/sanitized-mbpp.json
    sample_count: 20
    arrival_process: poisson
    arrival_rate_per_sec: 0.004167
  - dataset: gsm8k
    workflow_name: gsm8k1
    dataset_path: dataset/gsm8k/data/test.jsonl
    sample_count: 20
    arrival_process: poisson
    arrival_rate_per_sec: 0.004167
  - dataset: gsm8k
    workflow_name: gsm8k2
    dataset_path: dataset/gsm8k/data/test.jsonl
    sample_count: 20
    arrival_process: poisson
    arrival_rate_per_sec: 0.004167
