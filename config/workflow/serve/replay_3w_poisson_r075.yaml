# Open-loop Poisson arrival, 3 workflows (qmsum1 + mbpp1 + gsm8k1).
# Nominal aggregate session rate ~= 0.0375 session/s (rho~=0.75 vs the 2-dataset burst
# reference ~0.05), redistributed across 3 workflows: per-workflow lambda = 0.0375/3 = 0.0125.
# NOTE: gsm8k sessions are lighter, so true rho vs the 3-dataset burst-saturation is lower;
# recalibrate arrival_rate_per_sec after measuring a 3w burst-capacity (makespan -> throughput).
# Same arrival_seed across policies => identical arrival trace (paired comparison).
timeout_sec: 5400
arrival_seed: 42
scenarios:
  - dataset: qmsum
    workflow_name: qmsum1
    dataset_path: dataset/QMSum/data/ALL
    sample_count: 40
    arrival_process: poisson
    arrival_rate_per_sec: 0.0125
  - dataset: mbpp
    workflow_name: mbpp1
    dataset_path: dataset/mbpp/sanitized-mbpp.json
    sample_count: 40
    arrival_process: poisson
    arrival_rate_per_sec: 0.0125
  - dataset: gsm8k
    workflow_name: gsm8k1
    dataset_path: dataset/gsm8k/data/test.jsonl
    sample_count: 40
    arrival_process: poisson
    arrival_rate_per_sec: 0.0125
