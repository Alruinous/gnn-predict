# The full system: locality-first admission, near-ready prefetch, reuse-distance
# eviction and elastic replicas, with model lifecycle managed jointly across all
# registered workflows. Node fusion is a graph rewrite and is switched on separately
# with --fuse-nodes.
#
# Identical to config/workflow/serve/serve_0728/scheduler_sagepilot.yaml, and pinned
# equal to it by tests/test_serve_0729_configs.py: the two datasets are meant to be
# read together, so the full-system cell must not drift between them.
#
# elastic_replicas requires the cache policy: scale-out prices a new replica against
# the queue it would drain, which needs the frozen cache's run and load estimates, and
# _reload_cost returns None under fifo/kairos.
policy: cache
acquire_timeout_sec: 1800.0
elastic_replicas: true
max_replicas_per_model: 2
scale_out_margin_sec: 10.0
scale_in_idle_sec: 60.0
enable_prefetch: true
cross_workflow_lifecycle: true
# Anti-flap. Without it a pool whose device count equals its model count thrashes: one
# scale-out turns 5 residency claims on 5 devices into 6, and the homeless model then
# evicts someone else forever. Priced as a multiple of each replica's own measured load,
# so it needs no constant and scales from the 6.8s 0.6B load to the 257s 14B one.
min_residency_load_multiple: 1.0
