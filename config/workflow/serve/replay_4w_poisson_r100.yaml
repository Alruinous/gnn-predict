# Open-loop Poisson arrival, 4 workflows (qmsum1/qmsum2 + mbpp1/mbpp2).
# Aggregate offered load rho ~= 1.00 of measured burst saturation (~0.05 session/s);
# per-workflow lambda = 0.05/4 = 0.0125 session/s (mean inter-arrival ~80s).
# Each workflow is an independent Poisson stream (distinct trace_key => distinct seed).
# At rho~=1 arrivals approach the drain rate: queues build, fewer idle lulls.
timeout_sec: 5400
arrival_seed: 42
scenarios:
  - dataset: qmsum
    workflow_name: qmsum1
    dataset_path: dataset/QMSum/data/ALL
    sample_count: 30
    arrival_process: poisson
    arrival_rate_per_sec: 0.0125
  - dataset: qmsum
    workflow_name: qmsum2
    dataset_path: dataset/QMSum/data/ALL
    sample_count: 30
    arrival_process: poisson
    arrival_rate_per_sec: 0.0125
  - dataset: mbpp
    workflow_name: mbpp1
    dataset_path: dataset/mbpp/sanitized-mbpp.json
    sample_count: 30
    arrival_process: poisson
    arrival_rate_per_sec: 0.0125
  - dataset: mbpp
    workflow_name: mbpp2
    dataset_path: dataset/mbpp/sanitized-mbpp.json
    sample_count: 30
    arrival_process: poisson
    arrival_rate_per_sec: 0.0125
