experiment_name: gnn_model_scaled_train_6targets_delta
data:
  kind: split
  data_dir: data/scaled
  # Target order must match regenerated data/scaled and data/scalers artifacts.
  target_names:
    - duration_sec_avg
    - cpu_cores_p95
    # memory_gb_p95 is paused to evaluate startup-baseline memory delta.
    - memory_delta_gb_p95
    - gpu_util_percent_p95
    - gpu_sm_active_percent_p95
    - gpu_sm_occupancy_percent_p95
    - gpu_mem_used_mb_p95
  scaler_dir: data/scalers
model:
  hidden_dim: 128
  num_layers: 2
  num_heads: 8
  dropout_rate: 0.1
training:
  # Keep all targets equally weighted for this delta validation run.
  batch_size: 32
  num_epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001
