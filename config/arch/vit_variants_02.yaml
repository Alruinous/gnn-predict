base_model_groups:
- base_model:
    name: vit_tiny_patch16_224
    pretrained: true
  combinatorial_variant_grid: &vit_grid
    input_channels:
    - 3
    output_classes:
    - 20
    - 200
    - 1000
    base_variant_config_template: &vit_template
      example_input_shape:
      - 1
      - 3
      - 224
      - 224
      export_onnx: true
      onnx_export_mode: architecture_only
      use_fake_imagenet: true
      run_training: true
      training_epochs: 30
      training_batch_sizes:
      - 4
      fake_dataset_size: 32
      run_inference: true
      pre_inference_cooldown_seconds: 5.0
      inference_measurement_min_seconds: 60.0
    mutation_sets: &vit_mutations
    - name: no_mutations
      mutations: []
    - name: keep_8_blocks
      mutations:
      - type: ViTBlockReduction
        params:
          num_blocks_to_keep: 8
    - name: keep_6_blocks_head_512
      mutations:
      - type: ViTBlockReduction
        params:
          num_blocks_to_keep: 6
      - type: AddIntermediateFCLayer
        params:
          hidden_size: 512
          dropout_rate: 0.1
          activation: gelu
    - name: head_hidden_512
      mutations:
      - type: AddIntermediateFCLayer
        params:
          hidden_size: 512
          dropout_rate: 0.1
          activation: gelu
    - name: head_pyramid_1024_256
      mutations:
      - type: ReplaceFCStructure
        params:
          fc_structure:
          - 1024
          - 256
          dropout_rates:
          - 0.15
          - 0.1
          activations:
          - gelu
          - relu
- base_model:
    name: vit_small_patch16_224
    pretrained: true
  combinatorial_variant_grid: *vit_grid
- base_model:
    name: vit_base_patch32_224
    pretrained: true
  combinatorial_variant_grid: *vit_grid
