# Three controlled ResNet50 workloads for validating CoreX monitoring.
# Graph export is deliberately deferred: CoreX 2.4 .pt2 files are not yet
# validated against the central PyTorch 2.9 graph-processing environment.
base_model_groups:
  - base_model:
      name: resnet50
      pretrained: false
    single_variant_define:
      - name: corex_resnet50_smoke
        variant_config:
          target_input_channels: 3
          target_output_classes: 10
          example_input_shape: [1, 3, 224, 224]
          export_graph: true
          use_fake_imagenet: true
          run_training: true
          training_measurement_min_seconds: 60.0
          batch_size: 8
          run_inference: true
          pre_inference_cooldown_seconds: 5.0
          inference_measurement_min_seconds: 60.0
        mutations: []
      - name: corex_resnet50_batch16
        variant_config:
          target_input_channels: 3
          target_output_classes: 10
          example_input_shape: [1, 3, 224, 224]
          export_graph: false
          use_fake_imagenet: true
          run_training: true
          training_measurement_min_seconds: 60.0
          batch_size: 16
          run_inference: true
          pre_inference_cooldown_seconds: 5.0
          inference_measurement_min_seconds: 60.0
        mutations: []
      - name: corex_resnet50_input256
        variant_config:
          target_input_channels: 3
          target_output_classes: 10
          example_input_shape: [1, 3, 256, 256]
          export_graph: false
          use_fake_imagenet: true
          run_training: true
          training_measurement_min_seconds: 60.0
          batch_size: 8
          run_inference: true
          pre_inference_cooldown_seconds: 5.0
          inference_measurement_min_seconds: 60.0
        mutations: []
