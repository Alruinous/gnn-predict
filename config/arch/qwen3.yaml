# All active variants are decode-only.
# Comment A100-only groups before V100 runs because --gpu_node does not filter variants.
# Qwen3-32B is omitted because FP16 parameters exceed one 40GB A100.
base_model_groups:
# V100/A100: official 0.6B and 1.7B decode coverage.
- base_model:
    name: qwen3
    pretrained: false
  variant_config_grid:
    base_variant_config_template:
      example_input_shape:
      - 1
      - 128
      run_training: false
      run_inference: false
      run_prefill: false
      run_decode: true
      pre_inference_cooldown_seconds: 5.0
      pre_prefill_cooldown_seconds: 5.0
      pre_decode_cooldown_seconds: 5.0
      inference_measurement_min_seconds: 40.0
      prefill_measurement_min_seconds: 40.0
      decode_measurement_min_seconds: 40.0
      decode_max_output_length: 16
      export_graph: true
      batch_size: 1
      training_measurement_min_seconds: 40.0
      use_fake_text_dataset: true
      qwen3_config:
        vocab_size: 151936
        hidden_size: 1024
        intermediate_size: 3072
        num_hidden_layers: 28
        num_attention_heads: 16
        num_key_value_heads: 8
        head_dim: 128
        max_position_embeddings: 40960
        tie_word_embeddings: true
        rope_parameters:
          rope_theta: 1000000.0
          rope_type: default
    axes:
    - name: arch
      values:
      - name: official_0_6b
        overrides:
          qwen3_config.vocab_size: 151936
          qwen3_config.hidden_size: 1024
          qwen3_config.intermediate_size: 3072
          qwen3_config.num_hidden_layers: 28
          qwen3_config.num_attention_heads: 16
          qwen3_config.num_key_value_heads: 8
          qwen3_config.head_dim: 128
          qwen3_config.max_position_embeddings: 40960
          qwen3_config.tie_word_embeddings: true
      - name: official_1_7b
        overrides:
          qwen3_config.vocab_size: 151936
          qwen3_config.hidden_size: 2048
          qwen3_config.intermediate_size: 6144
          qwen3_config.num_hidden_layers: 28
          qwen3_config.num_attention_heads: 16
          qwen3_config.num_key_value_heads: 8
          qwen3_config.head_dim: 128
          qwen3_config.max_position_embeddings: 40960
          qwen3_config.tie_word_embeddings: true
    - name: shape
      values:
      - name: bs1_s128
        overrides:
          example_input_shape:
          - 1
          - 128
          batch_size: 1
      - name: bs1_s512
        overrides:
          example_input_shape:
          - 1
          - 512
          batch_size: 1
      - name: bs1_s1024
        overrides:
          example_input_shape:
          - 1
          - 1024
          batch_size: 1
      - name: bs1_s2048
        overrides:
          example_input_shape:
          - 1
          - 2048
          batch_size: 1
      - name: bs1_s4096
        overrides:
          example_input_shape:
          - 1
          - 4096
          batch_size: 1
      - name: bs1_s8192
        overrides:
          example_input_shape:
          - 1
          - 8192
          batch_size: 1
      - name: bs2_s128
        overrides:
          example_input_shape:
          - 2
          - 128
          batch_size: 2
      - name: bs2_s512
        overrides:
          example_input_shape:
          - 2
          - 512
          batch_size: 2
      - name: bs2_s1024
        overrides:
          example_input_shape:
          - 2
          - 1024
          batch_size: 2
      - name: bs2_s2048
        overrides:
          example_input_shape:
          - 2
          - 2048
          batch_size: 2
      - name: bs2_s4096
        overrides:
          example_input_shape:
          - 2
          - 4096
          batch_size: 2
      - name: bs4_s128
        overrides:
          example_input_shape:
          - 4
          - 128
          batch_size: 4
      - name: bs4_s512
        overrides:
          example_input_shape:
          - 4
          - 512
          batch_size: 4
      - name: bs4_s1024
        overrides:
          example_input_shape:
          - 4
          - 1024
          batch_size: 4
      - name: bs4_s2048
        overrides:
          example_input_shape:
          - 4
          - 2048
          batch_size: 4
    - name: output
      values:
      - name: o16
        overrides:
          decode_max_output_length: 16
      - name: o32
        overrides:
          decode_max_output_length: 32
      - name: o64
        overrides:
          decode_max_output_length: 64
      - name: o128
        overrides:
          decode_max_output_length: 128
      - name: o256
        overrides:
          decode_max_output_length: 256
      - name: o512
        overrides:
          decode_max_output_length: 512
      - name: o1024
        overrides:
          decode_max_output_length: 1024
