base_model_groups:
- base_model:
    name: Qwen2-0.5B
    pretrained: true
  variant_config_grid:
    base_variant_config_template: &qwen_full_template
      example_input_shape: [1, 128]
      max_sequence_length: 128
      run_training: true
      run_inference: false
      run_prefill: true
      pre_inference_cooldown_seconds: 5.0
      pre_prefill_cooldown_seconds: 5.0
      inference_measurement_min_seconds: 40.0
      prefill_measurement_min_seconds: 40.0
      export_onnx: true
      onnx_export_mode: architecture_only
      training_batch_sizes: [1]
      training_measurement_min_seconds: 40.0
      use_fake_text_dataset: true
    axes:
    - name: shape
      values: &qwen_full_shapes
      - name: bs1_s128
        overrides: {example_input_shape: [1, 128], max_sequence_length: 128, training_batch_sizes: [1]}
      - name: bs1_s256
        overrides: {example_input_shape: [1, 256], max_sequence_length: 256, training_batch_sizes: [1]}
      - name: bs1_s384
        overrides: {example_input_shape: [1, 384], max_sequence_length: 384, training_batch_sizes: [1]}
      - name: bs1_s512
        overrides: {example_input_shape: [1, 512], max_sequence_length: 512, training_batch_sizes: [1]}
      - name: bs1_s768
        overrides: {example_input_shape: [1, 768], max_sequence_length: 768, training_batch_sizes: [1]}
      - name: bs1_s1024
        overrides: {example_input_shape: [1, 1024], max_sequence_length: 1024, training_batch_sizes: [1]}
      - name: bs2_s128
        overrides: {example_input_shape: [2, 128], max_sequence_length: 128, training_batch_sizes: [2]}
      - name: bs2_s256
        overrides: {example_input_shape: [2, 256], max_sequence_length: 256, training_batch_sizes: [2]}
      - name: bs2_s384
        overrides: {example_input_shape: [2, 384], max_sequence_length: 384, training_batch_sizes: [2]}
      - name: bs2_s512
        overrides: {example_input_shape: [2, 512], max_sequence_length: 512, training_batch_sizes: [2]}
      - name: bs2_s768
        overrides: {example_input_shape: [2, 768], max_sequence_length: 768, training_batch_sizes: [2]}
      - name: bs2_s1024
        overrides: {example_input_shape: [2, 1024], max_sequence_length: 1024, training_batch_sizes: [2]}
      - name: bs3_s128
        overrides: {example_input_shape: [3, 128], max_sequence_length: 128, training_batch_sizes: [3]}
      - name: bs3_s256
        overrides: {example_input_shape: [3, 256], max_sequence_length: 256, training_batch_sizes: [3]}
      - name: bs3_s512
        overrides: {example_input_shape: [3, 512], max_sequence_length: 512, training_batch_sizes: [3]}
      - name: bs4_s128
        overrides: {example_input_shape: [4, 128], max_sequence_length: 128, training_batch_sizes: [4]}
      - name: bs4_s256
        overrides: {example_input_shape: [4, 256], max_sequence_length: 256, training_batch_sizes: [4]}
      - name: bs4_s384
        overrides: {example_input_shape: [4, 384], max_sequence_length: 384, training_batch_sizes: [4]}
      - name: bs4_s512
        overrides: {example_input_shape: [4, 512], max_sequence_length: 512, training_batch_sizes: [4]}
- base_model:
    name: Qwen2-1.5B
    pretrained: true
  variant_config_grid:
    base_variant_config_template: *qwen_full_template
    axes:
    - name: shape
      values: *qwen_full_shapes
