base_model_groups:
- base_model:
    name: resnet18
    pretrained: true
  single_variant_define:
  - name: resnet18_special_case
    variant_config:
      target_input_channels: 3
      target_output_classes: 500
      example_input_shape:
      - 1
      - 3
      - 224
      - 224
      export_graph: true
      run_training: true
      batch_size: 16
      training_measurement_min_seconds: 60.0
      use_fake_imagenet: true
      run_inference: true
      pre_inference_cooldown_seconds: 5.0
      inference_measurement_min_seconds: 60.0
    mutations:
    - type: ChannelPruning
      params:
        layer_name: layer4.0.conv1
        ratio: 0.5
    - type: ActivationSwap
      params:
        target_func_name: relu
        new_func_name: swish
  - name: resnet18_explicit_prune_l4_bn
    variant_config:
      target_input_channels: 3
      target_output_classes: 1000
      example_input_shape:
      - 1
      - 3
      - 224
      - 224
      run_training: true
      export_graph: true
      batch_size: 16
      training_measurement_min_seconds: 60.0
      use_fake_imagenet: true
      run_inference: true
      pre_inference_cooldown_seconds: 5.0
      inference_measurement_min_seconds: 60.0
    mutations:
    - type: ChannelPruning
      params:
        layer_name: layer4.0.bn1
        ratio: 0.3
  - name: resnet18_explicit_global_prune_20
    variant_config:
      target_input_channels: 3
      target_output_classes: 1000
      example_input_shape:
      - 1
      - 3
      - 224
      - 224
      export_graph: true
      run_training: true
      batch_size: 16
      training_measurement_min_seconds: 60.0
      use_fake_imagenet: true
      run_inference: true
      pre_inference_cooldown_seconds: 5.0
      inference_measurement_min_seconds: 60.0
    mutations:
    - type: GlobalChannelPruning
      params:
        pruning_ratio: 0.2
        pruning_method: l1
  combinatorial_variant_grid:
    input_channels:
    - 1
    - 3
    - 5
    - 7
    - 9
    output_classes:
    - 100
    - 200
    - 500
    base_variant_config_template:
      export_graph: true
      example_input_shape:
      - 1
      - 3
      - 224
      - 224
      use_fake_imagenet: true
      run_training: true
      training_measurement_min_seconds: 60.0
      batch_size: 16
      run_inference: true
      pre_inference_cooldown_seconds: 5.0
      inference_measurement_min_seconds: 60.0
    mutation_sets:
    - name: no_mutations
      mutations: []
    - name: kernel_1x1_conv1
      mutations:
      - type: ConvKernelReplacement
        params:
          layer_name: conv1
          new_kernel:
          - 1
          - 1
          padding: 0
    - name: prune_layer3_specific_indices
      mutations:
      - type: ChannelPruningByIndex
        params:
          layer_name: layer3.0.conv1
          prune_indices:
          - 0
          - 4
          - 8
          - 12
          - 16
    - name: prune_multiple_layers_by_index
      mutations:
      - type: ChannelPruningByIndex
        params:
          layer_name: layer1.0.conv1
          prune_indices:
          - 0
          - 2
          - 4
          - 6
      - type: ChannelPruningByIndex
        params:
          layer_name: layer2.0.conv1
          prune_indices:
          - 1
          - 3
          - 5
          - 7
    - name: prune_l1_l2_small
      mutations:
      - type: ChannelPruning
        params:
          layer_name: layer1.0.conv1
          ratio: 0.1
      - type: ChannelPruning
        params:
          layer_name: layer2.0.conv1
          ratio: 0.1
    - name: prune_conv1_fc_heavy
      mutations:
      - type: ChannelPruning
        params:
          layer_name: conv1
          ratio: 0.4
    - name: act_swap_relu_gelu
      mutations:
      - type: ActivationSwap
        params:
          target_func_name: relu
          new_func_name: gelu
    - name: prune_all_blocks_small
      mutations:
      - type: ChannelPruning
        params:
          layer_name: layer1.0.conv1
          ratio: 0.1
      - type: ChannelPruning
        params:
          layer_name: layer1.1.conv1
          ratio: 0.1
      - type: ChannelPruning
        params:
          layer_name: layer2.0.conv1
          ratio: 0.1
      - type: ChannelPruning
        params:
          layer_name: layer2.1.conv1
          ratio: 0.1
      - type: ChannelPruning
        params:
          layer_name: layer3.0.conv1
          ratio: 0.1
      - type: ChannelPruning
        params:
          layer_name: layer3.1.conv1
          ratio: 0.1
      - type: ChannelPruning
        params:
          layer_name: layer4.0.conv1
          ratio: 0.1
      - type: ChannelPruning
        params:
          layer_name: layer4.1.conv1
          ratio: 0.1
    - name: prune_l1_l2_small_plus_act
      mutations:
      - type: ChannelPruning
        params:
          layer_name: layer1.0.conv1
          ratio: 0.1
      - type: ChannelPruning
        params:
          layer_name: layer2.0.conv1
          ratio: 0.1
      - type: ActivationSwap
        params:
          target_func_name: relu
          new_func_name: gelu
    - name: prune_downsample_heavy
      mutations:
      - type: ChannelPruning
        params:
          layer_name: layer2.0.downsample.0
          ratio: 0.5
      - type: ChannelPruning
        params:
          layer_name: layer3.0.downsample.0
          ratio: 0.5
      - type: ChannelPruning
        params:
          layer_name: layer4.0.downsample.0
          ratio: 0.5
    - name: prune_bn_medium
      mutations:
      - type: ChannelPruning
        params:
          layer_name: bn1
          ratio: 0.2
      - type: ChannelPruning
        params:
          layer_name: layer1.0.bn1
          ratio: 0.2
      - type: ChannelPruning
        params:
          layer_name: layer4.1.bn2
          ratio: 0.2
    - name: kernel_5x5_l3_conv1
      mutations:
      - type: ConvKernelReplacement
        params:
          layer_name: layer3.0.conv1
          new_kernel:
          - 5
          - 5
          padding: 2
    - name: act_swap_relu_swish
      mutations:
      - type: ActivationSwap
        params:
          target_func_name: relu
          new_func_name: swish
    - name: combined_heavy
      mutations:
      - type: ChannelPruning
        params:
          layer_name: layer4.0.conv1
          ratio: 0.3
      - type: ConvKernelReplacement
        params:
          layer_name: layer2.1.conv2
          new_kernel:
          - 1
          - 1
          padding: 0
      - type: ActivationSwap
        params:
          target_func_name: relu
          new_func_name: gelu
    - name: global_l1_prune_30_excl_conv1_fc
      mutations:
      - type: GlobalChannelPruning
        params:
          pruning_ratio: 0.3
          pruning_method: l1
          ignored_layers:
          - conv1
          - fc
    - name: global_random_prune_40_only_layer34
      mutations:
      - type: GlobalChannelPruning
        params:
          pruning_ratio: 0.4
          pruning_method: random
          layers_to_target:
          - layer3
          - layer4
    - name: complex_fc_structure
      mutations:
      - type: ReplaceFCStructure
        params:
          fc_structure:
          - 1024
          - 512
          - 256
          dropout_rates:
          - 0.3
          - 0.2
          - 0.1
          activations:
          - relu
          - gelu
          - swish
    - name: combined_prune_and_fc
      mutations:
      - type: AddIntermediateFCLayer
        params:
          hidden_size: 512
          dropout_rate: 0.1
          activation: gelu
      - type: ChannelPruning
        params:
          layer_name: layer4.0.conv1
          ratio: 0.3
  fc_mutation_sets:
  - name: no_fc_mutation
    mutations: []
  - name: double_fc_layer
    mutations:
    - type: AddIntermediateFCLayer
      params:
        hidden_size: 512
        dropout_rate: 0.2
        activation: relu
