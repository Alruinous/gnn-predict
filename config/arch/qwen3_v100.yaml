base_model_groups:
- base_model:
    name: qwen3
    pretrained: false
  variant_config_grid:
    base_variant_config_template: &qwen3_full_template
      example_input_shape: [1, 128]
      run_training: true
      run_inference: false
      run_prefill: true
      run_decode: true
      pre_inference_cooldown_seconds: 5.0
      pre_prefill_cooldown_seconds: 5.0
      pre_decode_cooldown_seconds: 5.0
      inference_measurement_min_seconds: 60.0
      prefill_measurement_min_seconds: 60.0
      decode_measurement_min_seconds: 60.0
      decode_max_output_length: 32
      export_onnx: true
      onnx_export_mode: architecture_only
      batch_size: 1
      training_measurement_min_seconds: 60.0
      use_fake_text_dataset: true
      qwen3_config: &qwen3_h768_l20
        vocab_size: 151936
        hidden_size: 768
        intermediate_size: 2304
        num_hidden_layers: 20
        num_attention_heads: 12
        num_key_value_heads: 4
        head_dim: 128
        max_position_embeddings: 40960
        tie_word_embeddings: true
        rope_parameters: &qwen3_rope
          rope_theta: 1000000.0
          rope_type: default
    axes:
    - name: arch
      values: &qwen3_full_arches
      - name: h768_l20
        overrides: {qwen3_config.hidden_size: 768}
      - name: h768_l28
        overrides: {qwen3_config.num_hidden_layers: 28}
      - name: h1024_l20
        overrides: {qwen3_config.hidden_size: 1024, qwen3_config.intermediate_size: 3072, qwen3_config.num_hidden_layers: 20, qwen3_config.num_attention_heads: 16, qwen3_config.num_key_value_heads: 8}
      - name: h1024_l28
        overrides: {qwen3_config.hidden_size: 1024, qwen3_config.intermediate_size: 3072, qwen3_config.num_hidden_layers: 28, qwen3_config.num_attention_heads: 16, qwen3_config.num_key_value_heads: 8}
      - name: h1280_l20
        overrides: {qwen3_config.hidden_size: 1280, qwen3_config.intermediate_size: 4096, qwen3_config.num_hidden_layers: 20, qwen3_config.num_attention_heads: 20, qwen3_config.num_key_value_heads: 4}
      - name: h1280_l28
        overrides: {qwen3_config.hidden_size: 1280, qwen3_config.intermediate_size: 4096, qwen3_config.num_hidden_layers: 28, qwen3_config.num_attention_heads: 20, qwen3_config.num_key_value_heads: 4}
      - name: h1536_l20
        overrides: {qwen3_config.hidden_size: 1536, qwen3_config.intermediate_size: 5120, qwen3_config.num_hidden_layers: 20, qwen3_config.num_attention_heads: 24, qwen3_config.num_key_value_heads: 4}
      - name: h1536_l28
        overrides: {qwen3_config.hidden_size: 1536, qwen3_config.intermediate_size: 5120, qwen3_config.num_hidden_layers: 28, qwen3_config.num_attention_heads: 24, qwen3_config.num_key_value_heads: 4}
    - name: shape
      values: &qwen3_full_shapes
      - name: bs1_s128
        overrides: {example_input_shape: [1, 128], batch_size: 1}
      - name: bs1_s256
        overrides: {example_input_shape: [1, 256], batch_size: 1}
      - name: bs1_s384
        overrides: {example_input_shape: [1, 384], batch_size: 1}
      - name: bs1_s512
        overrides: {example_input_shape: [1, 512], batch_size: 1}
      - name: bs1_s768
        overrides: {example_input_shape: [1, 768], batch_size: 1}
      - name: bs1_s1024
        overrides: {example_input_shape: [1, 1024], batch_size: 1}
      - name: bs2_s128
        overrides: {example_input_shape: [2, 128], batch_size: 2}
      - name: bs2_s256
        overrides: {example_input_shape: [2, 256], batch_size: 2}
      - name: bs2_s384
        overrides: {example_input_shape: [2, 384], batch_size: 2}
      - name: bs2_s512
        overrides: {example_input_shape: [2, 512], batch_size: 2}
      - name: bs2_s768
        overrides: {example_input_shape: [2, 768], batch_size: 2}
      - name: bs2_s1024
        overrides: {example_input_shape: [2, 1024], batch_size: 2}
      - name: bs3_s128
        overrides: {example_input_shape: [3, 128], batch_size: 3}
      - name: bs3_s256
        overrides: {example_input_shape: [3, 256], batch_size: 3}
      - name: bs3_s512
        overrides: {example_input_shape: [3, 512], batch_size: 3}
      - name: bs4_s128
        overrides: {example_input_shape: [4, 128], batch_size: 4}
      - name: bs4_s256
        overrides: {example_input_shape: [4, 256], batch_size: 4}
      - name: bs4_s384
        overrides: {example_input_shape: [4, 384], batch_size: 4}
      - name: bs4_s512
        overrides: {example_input_shape: [4, 512], batch_size: 4}
- base_model:
    name: qwen3
    pretrained: false
  variant_config_grid:
    base_variant_config_template: *qwen3_full_template
    axes:
    - name: arch
      values:
      - name: h1792_l28
        overrides: {qwen3_config.hidden_size: 1792, qwen3_config.intermediate_size: 5632, qwen3_config.num_hidden_layers: 28, qwen3_config.num_attention_heads: 28, qwen3_config.num_key_value_heads: 4}
      - name: h2048_l20
        overrides: {qwen3_config.hidden_size: 2048, qwen3_config.intermediate_size: 6144, qwen3_config.num_hidden_layers: 20, qwen3_config.num_attention_heads: 16, qwen3_config.num_key_value_heads: 8}
      - name: h2048_l28
        overrides: {qwen3_config.hidden_size: 2048, qwen3_config.intermediate_size: 6144, qwen3_config.num_hidden_layers: 28, qwen3_config.num_attention_heads: 16, qwen3_config.num_key_value_heads: 8}
    - name: shape
      values:
      - name: bs1_s128
        overrides: {example_input_shape: [1, 128], batch_size: 1}
      - name: bs1_s256
        overrides: {example_input_shape: [1, 256], batch_size: 1}
      - name: bs1_s512
        overrides: {example_input_shape: [1, 512], batch_size: 1}
      - name: bs1_s1024
        overrides: {example_input_shape: [1, 1024], batch_size: 1}
      - name: bs2_s128
        overrides: {example_input_shape: [2, 128], batch_size: 2}
      - name: bs2_s256
        overrides: {example_input_shape: [2, 256], batch_size: 2}
      - name: bs2_s512
        overrides: {example_input_shape: [2, 512], batch_size: 2}
      - name: bs4_s128
        overrides: {example_input_shape: [4, 128], batch_size: 4}
- base_model:
    name: qwen3
    pretrained: false
  variant_config_grid:
    base_variant_config_template: &qwen3_prefill_template
      <<: *qwen3_full_template
      run_training: false
      run_decode: false
      decode_max_output_length: 0
    axes:
    - name: arch
      values:
      - name: h2304_l32
        overrides: {qwen3_config.hidden_size: 2304, qwen3_config.intermediate_size: 8192, qwen3_config.num_hidden_layers: 32, qwen3_config.num_attention_heads: 24, qwen3_config.num_key_value_heads: 8}
      - name: h2560_l36
        overrides: {qwen3_config.hidden_size: 2560, qwen3_config.intermediate_size: 9728, qwen3_config.num_hidden_layers: 36, qwen3_config.num_attention_heads: 32, qwen3_config.num_key_value_heads: 8}
    - name: shape
      values: &qwen3_prefill_shapes
      - name: bs1_s64
        overrides: {example_input_shape: [1, 64], batch_size: 1}
      - name: bs1_s128
        overrides: {example_input_shape: [1, 128], batch_size: 1}
      - name: bs1_s192
        overrides: {example_input_shape: [1, 192], batch_size: 1}
      - name: bs1_s256
        overrides: {example_input_shape: [1, 256], batch_size: 1}
      - name: bs1_s384
        overrides: {example_input_shape: [1, 384], batch_size: 1}
      - name: bs1_s512
        overrides: {example_input_shape: [1, 512], batch_size: 1}
      - name: bs2_s64
        overrides: {example_input_shape: [2, 64], batch_size: 2}
      - name: bs2_s128
        overrides: {example_input_shape: [2, 128], batch_size: 2}
      - name: bs2_s192
        overrides: {example_input_shape: [2, 192], batch_size: 2}
      - name: bs2_s256
        overrides: {example_input_shape: [2, 256], batch_size: 2}
- base_model:
    name: qwen3
    pretrained: false
  variant_config_grid:
    base_variant_config_template: &qwen3_short_decode_template
      <<: *qwen3_full_template
      run_training: false
      run_prefill: false
      run_decode: true
      decode_max_output_length: 16
    axes:
    - name: arch
      values:
      - name: h1024_l28
        overrides: {qwen3_config.hidden_size: 1024, qwen3_config.intermediate_size: 3072, qwen3_config.num_hidden_layers: 28, qwen3_config.num_attention_heads: 16, qwen3_config.num_key_value_heads: 8}
      - name: h1536_l28
        overrides: {qwen3_config.hidden_size: 1536, qwen3_config.intermediate_size: 5120, qwen3_config.num_hidden_layers: 28, qwen3_config.num_attention_heads: 24, qwen3_config.num_key_value_heads: 4}
      - name: h2048_l28
        overrides: {qwen3_config.hidden_size: 2048, qwen3_config.intermediate_size: 6144, qwen3_config.num_hidden_layers: 28, qwen3_config.num_attention_heads: 16, qwen3_config.num_key_value_heads: 8}
    - name: shape
      values:
      - name: decode_bs1_s128
        overrides: {example_input_shape: [1, 128], batch_size: 1}
      - name: decode_bs1_s512
        overrides: {example_input_shape: [1, 512], batch_size: 1}
      - name: decode_bs2_s128
        overrides: {example_input_shape: [2, 128], batch_size: 2}
      - name: decode_bs2_s512
        overrides: {example_input_shape: [2, 512], batch_size: 2}
    - name: output
      values:
      - name: o16
        overrides: {decode_max_output_length: 16}
      - name: o128
        overrides: {decode_max_output_length: 128}
      - name: o256
        overrides: {decode_max_output_length: 256}
