base_model_groups:
- base_model:
    name: inception_v3
    pretrained: true
  combinatorial_variant_grid:
    input_channels:
    - 3
    output_classes:
    - 10
    - 100
    - 1000
    base_variant_config_template:
      example_input_shape:
      - 1
      - 3
      - 299
      - 299
      export_graph: true
      use_fake_imagenet: true
      run_training: true
      training_measurement_min_seconds: 60.0
      batch_size: 64
      run_inference: true
      pre_inference_cooldown_seconds: 5.0
      inference_measurement_min_seconds: 60.0
    mutation_sets:
    - name: no_mutations
      mutations: []
    - name: early_conv_light_pruning
      mutations:
      - type: ChannelPruning
        params:
          layer_name: Conv2d_1a_3x3.conv
          ratio: 0.25
    - name: early_conv_medium_pruning
      mutations:
      - type: ChannelPruning
        params:
          layer_name: Conv2d_1a_3x3.conv
          ratio: 0.5
      - type: ChannelPruning
        params:
          layer_name: Conv2d_2a_3x3.conv
          ratio: 0.25
    - name: early_conv_heavy_pruning
      mutations:
      - type: ChannelPruning
        params:
          layer_name: Conv2d_1a_3x3.conv
          ratio: 0.5
      - type: ChannelPruning
        params:
          layer_name: Conv2d_2a_3x3.conv
          ratio: 0.5
      - type: ChannelPruning
        params:
          layer_name: Conv2d_2b_3x3.conv
          ratio: 0.25
    - name: middle_layer_pruning
      mutations:
      - type: ChannelPruning
        params:
          layer_name: Conv2d_3b_1x1.conv
          ratio: 0.3
      - type: ChannelPruning
        params:
          layer_name: Conv2d_4a_3x3.conv
          ratio: 0.25
    - name: comprehensive_light_pruning
      mutations:
      - type: ChannelPruning
        params:
          layer_name: Conv2d_1a_3x3.conv
          ratio: 0.25
      - type: ChannelPruning
        params:
          layer_name: Conv2d_2b_3x3.conv
          ratio: 0.2
      - type: ChannelPruning
        params:
          layer_name: Conv2d_3b_1x1.conv
          ratio: 0.2
      - type: ChannelPruning
        params:
          layer_name: Conv2d_4a_3x3.conv
          ratio: 0.15
    - name: inception_a_branch_pruning_light
      mutations:
      - type: ChannelPruning
        params:
          layer_name: Mixed_5b.branch1x1.conv
          ratio: 0.25
      - type: ChannelPruning
        params:
          layer_name: Mixed_5b.branch5x5_1.conv
          ratio: 0.3
    - name: inception_a_branch_pruning_medium
      mutations:
      - type: ChannelPruning
        params:
          layer_name: Mixed_5b.branch1x1.conv
          ratio: 0.4
      - type: ChannelPruning
        params:
          layer_name: Mixed_5c.branch1x1.conv
          ratio: 0.4
      - type: ChannelPruning
        params:
          layer_name: Mixed_5d.branch1x1.conv
          ratio: 0.4
    - name: inception_a_comprehensive_pruning
      mutations:
      - type: ChannelPruning
        params:
          layer_name: Mixed_5b.branch1x1.conv
          ratio: 0.5
      - type: ChannelPruning
        params:
          layer_name: Mixed_5b.branch5x5_1.conv
          ratio: 0.4
      - type: ChannelPruning
        params:
          layer_name: Mixed_5b.branch3x3dbl_1.conv
          ratio: 0.3
      - type: ChannelPruning
        params:
          layer_name: Mixed_5b.branch_pool.conv
          ratio: 0.5
    - name: inception_c_pruning
      mutations:
      - type: ChannelPruning
        params:
          layer_name: Mixed_6b.branch1x1.conv
          ratio: 0.3
      - type: ChannelPruning
        params:
          layer_name: Mixed_6c.branch1x1.conv
          ratio: 0.3
      - type: ChannelPruning
        params:
          layer_name: Mixed_6d.branch1x1.conv
          ratio: 0.3
      - type: ChannelPruning
        params:
          layer_name: Mixed_6e.branch1x1.conv
          ratio: 0.3
    - name: swish_activation
      mutations:
      - type: ActivationSwap
        params:
          target_func_name: relu
          new_func_name: swish
    - name: gelu_activation
      mutations:
      - type: ActivationSwap
        params:
          target_func_name: relu
          new_func_name: gelu
    - name: leaky_relu_activation
      mutations:
      - type: ActivationSwap
        params:
          target_func_name: relu
          new_func_name: leaky_relu
    - name: kernel_replacement_3x3_to_1x1
      mutations:
      - type: ConvKernelReplacement
        params:
          layer_name: Conv2d_2a_3x3.conv
          new_kernel:
          - 1
          - 1
          padding: 0
    - name: kernel_replacement_mixed
      mutations:
      - type: ConvKernelReplacement
        params:
          layer_name: Conv2d_2a_3x3.conv
          new_kernel:
          - 1
          - 1
          padding: 0
      - type: ConvKernelReplacement
        params:
          layer_name: Conv2d_4a_3x3.conv
          new_kernel:
          - 5
          - 5
          padding: 2
    - name: aggressive_kernel_replacement
      mutations:
      - type: ConvKernelReplacement
        params:
          layer_name: Conv2d_2a_3x3.conv
          new_kernel:
          - 1
          - 1
          padding: 0
      - type: ConvKernelReplacement
        params:
          layer_name: Conv2d_2b_3x3.conv
          new_kernel:
          - 1
          - 1
          padding: 0
      - type: ConvKernelReplacement
        params:
          layer_name: Conv2d_4a_3x3.conv
          new_kernel:
          - 1
          - 1
          padding: 0
    - name: efficient_inception_v1
      mutations:
      - type: ChannelPruning
        params:
          layer_name: Conv2d_1a_3x3.conv
          ratio: 0.3
      - type: ChannelPruning
        params:
          layer_name: Conv2d_2b_3x3.conv
          ratio: 0.25
      - type: ActivationSwap
        params:
          target_func_name: relu
          new_func_name: swish
    - name: efficient_inception_v2
      mutations:
      - type: ChannelPruning
        params:
          layer_name: Mixed_5b.branch1x1.conv
          ratio: 0.4
      - type: ChannelPruning
        params:
          layer_name: Mixed_6b.branch1x1.conv
          ratio: 0.3
      - type: ConvKernelReplacement
        params:
          layer_name: Conv2d_2a_3x3.conv
          new_kernel:
          - 1
          - 1
          padding: 0
    - name: mobile_inception
      mutations:
      - type: ChannelPruning
        params:
          layer_name: Conv2d_1a_3x3.conv
          ratio: 0.5
      - type: ChannelPruning
        params:
          layer_name: Conv2d_2a_3x3.conv
          ratio: 0.5
      - type: ChannelPruning
        params:
          layer_name: Conv2d_2b_3x3.conv
          ratio: 0.4
      - type: ChannelPruning
        params:
          layer_name: Mixed_5b.branch1x1.conv
          ratio: 0.6
      - type: ConvKernelReplacement
        params:
          layer_name: Conv2d_2a_3x3.conv
          new_kernel:
          - 1
          - 1
          padding: 0
      - type: ActivationSwap
        params:
          target_func_name: relu
          new_func_name: swish
    - name: ultra_efficient_inception
      mutations:
      - type: ChannelPruning
        params:
          layer_name: Conv2d_1a_3x3.conv
          ratio: 0.6
      - type: ChannelPruning
        params:
          layer_name: Conv2d_2a_3x3.conv
          ratio: 0.6
      - type: ChannelPruning
        params:
          layer_name: Conv2d_2b_3x3.conv
          ratio: 0.5
      - type: ChannelPruning
        params:
          layer_name: Conv2d_3b_1x1.conv
          ratio: 0.5
      - type: ChannelPruning
        params:
          layer_name: Conv2d_4a_3x3.conv
          ratio: 0.4
      - type: ChannelPruning
        params:
          layer_name: Mixed_5b.branch1x1.conv
          ratio: 0.7
      - type: ConvKernelReplacement
        params:
          layer_name: Conv2d_2a_3x3.conv
          new_kernel:
          - 1
          - 1
          padding: 0
      - type: ConvKernelReplacement
        params:
          layer_name: Conv2d_2b_3x3.conv
          new_kernel:
          - 1
          - 1
          padding: 0
      - type: ActivationSwap
        params:
          target_func_name: relu
          new_func_name: swish
    - name: inception_e_lightweight
      mutations:
      - type: ChannelPruning
        params:
          layer_name: Mixed_7b.branch1x1.conv
          ratio: 0.4
      - type: ChannelPruning
        params:
          layer_name: Mixed_7c.branch1x1.conv
          ratio: 0.4
    - name: late_stage_pruning
      mutations:
      - type: ChannelPruning
        params:
          layer_name: Mixed_7b.branch1x1.conv
          ratio: 0.5
      - type: ChannelPruning
        params:
          layer_name: Mixed_7c.branch1x1.conv
          ratio: 0.5
      - type: ChannelPruning
        params:
          layer_name: Mixed_7b.branch3x3_1.conv
          ratio: 0.3
      - type: ChannelPruning
        params:
          layer_name: Mixed_7c.branch3x3_1.conv
          ratio: 0.3
    - name: progressive_pruning
      mutations:
      - type: ChannelPruning
        params:
          layer_name: Conv2d_1a_3x3.conv
          ratio: 0.2
      - type: ChannelPruning
        params:
          layer_name: Mixed_5b.branch1x1.conv
          ratio: 0.3
      - type: ChannelPruning
        params:
          layer_name: Mixed_6b.branch1x1.conv
          ratio: 0.4
      - type: ChannelPruning
        params:
          layer_name: Mixed_7b.branch1x1.conv
          ratio: 0.5
    - name: balanced_all_stages
      mutations:
      - type: ChannelPruning
        params:
          layer_name: Conv2d_1a_3x3.conv
          ratio: 0.3
      - type: ChannelPruning
        params:
          layer_name: Conv2d_2b_3x3.conv
          ratio: 0.3
      - type: ChannelPruning
        params:
          layer_name: Conv2d_4a_3x3.conv
          ratio: 0.3
      - type: ChannelPruning
        params:
          layer_name: Mixed_5b.branch1x1.conv
          ratio: 0.3
      - type: ChannelPruning
        params:
          layer_name: Mixed_6b.branch1x1.conv
          ratio: 0.3
      - type: ChannelPruning
        params:
          layer_name: Mixed_7b.branch1x1.conv
          ratio: 0.3
    - name: inception_branch_diversity
      mutations:
      - type: ChannelPruning
        params:
          layer_name: Mixed_5b.branch1x1.conv
          ratio: 0.5
      - type: ChannelPruning
        params:
          layer_name: Mixed_5b.branch3x3dbl_1.conv
          ratio: 0.3
      - type: ChannelPruning
        params:
          layer_name: Mixed_6b.branch7x7_1.conv
          ratio: 0.4
      - type: ChannelPruning
        params:
          layer_name: Mixed_7b.branch3x3_1.conv
          ratio: 0.3
    - name: mish_activation
      mutations:
      - type: ActivationSwap
        params:
          target_func_name: relu
          new_func_name: mish
    - name: elu_activation
      mutations:
      - type: ActivationSwap
        params:
