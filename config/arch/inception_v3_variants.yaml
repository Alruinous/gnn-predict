          ratio: 0.5
      - type: ChannelPruning
        params:
          layer_name: Conv2d_3b_1x1.conv
          ratio: 0.5
      - type: ChannelPruning
        params:
          layer_name: Conv2d_4a_3x3.conv
          ratio: 0.4
      - type: ChannelPruning
        params:
          layer_name: Mixed_5b.branch1x1.conv
          ratio: 0.7
      - type: ConvKernelReplacement
        params:
          layer_name: Conv2d_2a_3x3.conv
          old_kernel_size:
          - 3
          - 3
          new_kernel_size:
          - 1
          - 1
      - type: ConvKernelReplacement
        params:
          layer_name: Conv2d_2b_3x3.conv
          old_kernel_size:
          - 3
          - 3
          new_kernel_size:
          - 1
          - 1
      - type: ActivationSwap
        params:
          old_activation: ReLU
