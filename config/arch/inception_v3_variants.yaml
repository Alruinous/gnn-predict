      - type: ActivationSwap
        params:
          target_func_name: relu
          new_func_name: gelu
    - name: depthwise_simulation
      mutations:
      - type: ConvKernelReplacement
        params:
          layer_name: Conv2d_2b_3x3.conv
          new_kernel:
          - 1
          - 1
          padding: 0
      - type: ConvKernelReplacement
        params:
          layer_name: Conv2d_4a_3x3.conv
          new_kernel:
          - 1
          - 1
          padding: 0
      - type: ChannelPruning
        params:
          layer_name: Conv2d_2b_3x3.conv
          ratio: 0.5
    - name: kernel_size_progression
      mutations:
      - type: ConvKernelReplacement
        params:
          layer_name: Conv2d_2a_3x3.conv
          new_kernel:
          - 1
          - 1
          padding: 0
      - type: ConvKernelReplacement
        params:
          layer_name: Conv2d_4a_3x3.conv
          new_kernel:
          - 5
          - 5
          padding: 2
    - name: large_kernel_experiment
      mutations:
      - type: ConvKernelReplacement
        params:
          layer_name: Conv2d_2a_3x3.conv
          new_kernel:
          - 7
          - 7
          padding: 3
      - type: ConvKernelReplacement
        params:
          layer_name: Conv2d_4a_3x3.conv
          new_kernel:
          - 7
          - 7
          padding: 3
    - name: asymmetric_kernels
      mutations:
      - type: ConvKernelReplacement
        params:
          layer_name: Conv2d_2a_3x3.conv
          new_kernel:
          - 1
          - 3
          padding:
          - 0
          - 1
      - type: ConvKernelReplacement
        params:
          layer_name: Conv2d_2b_3x3.conv
          new_kernel:
          - 3
          - 1
          padding:
          - 1
          - 0
    - name: mixed_kernel_strategy
      mutations:
      - type: ConvKernelReplacement
        params:
          layer_name: Conv2d_2a_3x3.conv
          new_kernel:
          - 1
          - 1
          padding: 0
      - type: ConvKernelReplacement
        params:
          layer_name: Conv2d_4a_3x3.conv
          new_kernel:
          - 5
