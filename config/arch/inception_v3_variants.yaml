      mutations:
      - type: ChannelPruning
        params:
          layer_name: Conv2d_1a_3x3.conv
          ratio: 0.3
      - type: ChannelPruning
        params:
          layer_name: Conv2d_2b_3x3.conv
          ratio: 0.4
      - type: ChannelPruning
        params:
          layer_name: Mixed_5b.branch1x1.conv
          ratio: 0.5
      - type: ChannelPruning
        params:
          layer_name: Mixed_6b.branch1x1.conv
          ratio: 0.4
