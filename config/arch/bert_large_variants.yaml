    - name: combo_medium_2_large
      mutations:
      - type: BertLayerPruning
        params:
          pruning_ratio: 0.25
      - type: BertAttentionHeadPruning
        params:
          pruning_ratio: 0.25
    - name: combo_medium_3_large
      mutations:
      - type: TransformerLayerReduction
        params:
          target_layers: 12
      - type: IntermediateSizeModification
        params:
          intermediate_size: 3072
    - name: combo_medium_4_large
      mutations:
      - type: HiddenSizeModification
        params:
          hidden_size: 768
      - type: TransformerLayerReduction
        params:
          target_layers: 18
    - name: combo_medium_5_large
      mutations:
      - type: BertHiddenSizePruning
        params:
          pruning_ratio: 0.25
      - type: TransformerLayerReduction
        params:
          target_layers: 16
    - name: combo_medium_6_large
      mutations:
      - type: AttentionHeadsModification
        params:
          num_heads: 8
      - type: IntermediateSizeModification
        params:
          intermediate_size: 2048
      - type: DropoutModification
        params:
          hidden_dropout_prob: 0.15
          attention_probs_dropout_prob: 0.15
    - name: combo_heavy_1_large
      mutations:
      - type: TransformerLayerReduction
        params:
          target_layers: 12
      - type: AttentionHeadsModification
        params:
          num_heads: 8
      - type: IntermediateSizeModification
        params:
          intermediate_size: 1536
    - name: combo_heavy_2_large
      mutations:
      - type: BertLayerPruning
        params:
          pruning_ratio: 0.5
      - type: BertAttentionHeadPruning
        params:
          pruning_ratio: 0.5
    - name: combo_heavy_3_large
      mutations:
      - type: HiddenSizeModification
        params:
          hidden_size: 512
      - type: TransformerLayerReduction
        params:
          target_layers: 12
    - name: combo_heavy_4_large
      mutations:
      - type: BertHiddenSizePruning
        params:
          pruning_ratio: 0.5
      - type: TransformerLayerReduction
        params:
