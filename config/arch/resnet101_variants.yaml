        params:
          fc_structure:
          - 3072
          - 1536
          - 512
          dropout_rates:
          - 0.3
          - 0.25
          - 0.2
          activations:
          - relu
          - gelu
          - swish
    - name: resnet101_fc_progressive
      mutations:
      - type: ReplaceFCStructure
        params:
          fc_structure:
          - 2560
          - 1280
          - 640
          - 320
          dropout_rates:
          - 0.25
          - 0.2
          - 0.15
          - 0.1
          activations:
          - gelu
          - swish
          - relu
          - gelu
    - name: resnet101_fc_deep_narrow
      mutations:
      - type: ReplaceFCStructure
        params:
          fc_structure:
          - 1024
          - 512
          - 256
          - 128
          - 64
          dropout_rates:
          - 0.2
          - 0.15
          - 0.1
          - 0.05
          - 0.02
          activations:
          - swish
          - gelu
          - relu
          - swish
          - gelu
    - name: light_combo_resnet101_layer1_2
      mutations:
