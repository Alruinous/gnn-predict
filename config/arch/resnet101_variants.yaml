          - 1
          - 1
          padding: 0
      - type: ChannelPruning
        params:
          layer_name: layer3.8.conv1
          ratio: 0.25
      - type: ChannelPruning
        params:
          layer_name: layer3.9.conv1
          ratio: 0.25
    - name: heavy_combo_resnet101_compression
      mutations:
      - type: GlobalChannelPruning
        params:
          pruning_ratio: 0.4
          pruning_method: l2
      - type: ConvKernelReplacement
        params:
          layer_name: layer2.2.conv2
          new_kernel:
          - 1
          - 1
          padding: 0
      - type: ReplaceFCStructure
        params:
          fc_structure:
          - 1024
          - 256
          dropout_rates:
          - 0.4
          - 0.3
