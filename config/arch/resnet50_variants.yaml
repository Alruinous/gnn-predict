      - type: ConvKernelReplacement
        params:
          layer_name: layer3.5.conv2
          new_kernel:
          - 1
          - 1
          padding: 0
      - type: ActivationSwap
        params:
          target_func_name: relu
          new_func_name: swish
    - name: heavy_combo_systematic_reduction
      mutations:
      - type: GlobalChannelPruning
        params:
          pruning_ratio: 0.45
          pruning_method: l2
      - type: ConvKernelReplacement
        params:
          layer_name: conv1
          new_kernel:
          - 3
          - 3
          padding: 1
          stride: 2
      - type: ReplaceFCStructure
        params:
          fc_structure:
          - 1024
          - 256
          dropout_rates:
          - 0.4
          - 0.3
          activations:
          - gelu
          - swish
    - name: heavy_combo_bottleneck_decimation
      mutations:
      - type: ChannelPruning
        params:
          layer_name: layer1.0.conv1
          ratio: 0.3
      - type: ChannelPruning
        params:
          layer_name: layer2.0.conv1
          ratio: 0.35
      - type: ChannelPruning
        params:
          layer_name: layer3.0.conv1
          ratio: 0.4
      - type: ChannelPruning
        params:
          layer_name: layer4.0.conv1
          ratio: 0.5
      - type: ActivationSwap
        params:
          target_func_name: relu
          new_func_name: gelu
      - type: AddIntermediateFCLayer
        params:
          hidden_size: 512
          dropout_rate: 0.3
          activation: swish
    - name: heavy_combo_extreme_compression
      mutations:
      - type: GlobalChannelPruning
        params:
          pruning_ratio: 0.6
          pruning_method: random
          layers_to_target:
          - layer3
          - layer4
      - type: ChannelPruning
        params:
          layer_name: layer2.3.conv3
          ratio: 0.5
      - type: ConvKernelReplacement
        params:
          layer_name: layer1.1.conv2
          new_kernel:
          - 1
          - 1
          padding: 0
      - type: ReplaceFCStructure
        params:
          fc_structure:
          - 512
          - 128
          dropout_rates:
          - 0.5
          - 0.4
          activations:
          - swish
          - gelu
    - name: kernel_7x7_layer2_conv2
      mutations:
      - type: ConvKernelReplacement
        params:
          layer_name: layer2.1.conv2
          new_kernel:
          - 7
          - 7
          padding: 3
    - name: kernel_mixed_layer1_conv2
      mutations:
      - type: ConvKernelReplacement
        params:
          layer_name: layer1.0.conv2
          new_kernel:
