base_model_groups:
- base_model:
    name: resnet50
    pretrained: true
  combinatorial_variant_grid:
    input_channels:
    - 1
    output_classes:
    - 10
    base_variant_config_template:
      export_onnx: false
      onnx_export_mode: architecture_only
      example_input_shape:
      - 1
      - 3
      - 224
      - 224
      use_fake_imagenet: true
      run_training: true
      training_epochs: 3
      training_batch_sizes:
      - 16
      - 64
      - 128
      fake_dataset_size: 5000
      run_inference: true
      pre_inference_cooldown_seconds: 5.0
      inference_measurement_min_seconds: 60.0
    mutation_sets:
    - name: no_mutations
      mutations: []
    - name: kernel_1x1_conv1
      mutations:
      - type: ConvKernelReplacement
        params:
          layer_name: conv1
          new_kernel:
          - 1
          - 1
          padding: 0
    - name: kernel_5x5_conv1
      mutations:
      - type: ConvKernelReplacement
        params:
          layer_name: conv1
          new_kernel:
          - 5
          - 5
          padding: 2
          stride: 2
    - name: kernel_3x3_conv1
      mutations:
      - type: ConvKernelReplacement
        params:
          layer_name: conv1
          new_kernel:
          - 3
          - 3
          padding: 1
          stride: 2
    - name: kernel_5x5_layer2_bottleneck_conv2
      mutations:
      - type: ConvKernelReplacement
        params:
          layer_name: layer2.0.conv2
          new_kernel:
          - 5
          - 5
          padding: 2
    - name: kernel_1x1_layer3_bottleneck_conv2
      mutations:
      - type: ConvKernelReplacement
        params:
          layer_name: layer3.0.conv2
          new_kernel:
          - 1
          - 1
          padding: 0
      - type: ConvKernelReplacement
        params:
          layer_name: layer3.1.conv2
          new_kernel:
          - 1
          - 1
          padding: 0
    - name: prune_stem_conv1
      mutations:
      - type: ChannelPruning
        params:
          layer_name: conv1
          ratio: 0.2
    - name: prune_layer1_bottleneck_conv1
      mutations:
      - type: ChannelPruning
        params:
          layer_name: layer1.0.conv1
          ratio: 0.15
      - type: ChannelPruning
        params:
          layer_name: layer1.1.conv1
          ratio: 0.15
      - type: ChannelPruning
        params:
          layer_name: layer1.2.conv1
          ratio: 0.15
    - name: prune_layer1_bottleneck_conv3
      mutations:
      - type: ChannelPruning
        params:
          layer_name: layer1.0.conv3
          ratio: 0.2
      - type: ChannelPruning
        params:
          layer_name: layer1.1.conv3
          ratio: 0.2
      - type: ChannelPruning
        params:
          layer_name: layer1.2.conv3
          ratio: 0.2
    - name: prune_layer2_bottleneck_conv1
      mutations:
      - type: ChannelPruning
        params:
          layer_name: layer2.0.conv1
          ratio: 0.2
      - type: ChannelPruning
        params:
          layer_name: layer2.1.conv1
          ratio: 0.2
      - type: ChannelPruning
        params:
          layer_name: layer2.2.conv1
          ratio: 0.2
      - type: ChannelPruning
        params:
          layer_name: layer2.3.conv1
          ratio: 0.2
    - name: prune_layer2_bottleneck_conv3
      mutations:
      - type: ChannelPruning
        params:
          layer_name: layer2.0.conv3
          ratio: 0.25
      - type: ChannelPruning
        params:
          layer_name: layer2.1.conv3
          ratio: 0.25
      - type: ChannelPruning
        params:
          layer_name: layer2.2.conv3
          ratio: 0.25
      - type: ChannelPruning
        params:
          layer_name: layer2.3.conv3
          ratio: 0.25
    - name: prune_layer3_early_blocks
      mutations:
      - type: ChannelPruning
        params:
          layer_name: layer3.0.conv1
          ratio: 0.25
      - type: ChannelPruning
        params:
          layer_name: layer3.1.conv1
          ratio: 0.25
      - type: ChannelPruning
        params:
          layer_name: layer3.2.conv1
          ratio: 0.25
    - name: prune_layer3_middle_blocks
      mutations:
      - type: ChannelPruning
        params:
          layer_name: layer3.2.conv1
          ratio: 0.3
      - type: ChannelPruning
        params:
          layer_name: layer3.3.conv1
          ratio: 0.3
      - type: ChannelPruning
        params:
          layer_name: layer3.4.conv1
          ratio: 0.3
    - name: prune_layer3_late_blocks
      mutations:
      - type: ChannelPruning
        params:
          layer_name: layer3.3.conv1
          ratio: 0.35
      - type: ChannelPruning
        params:
          layer_name: layer3.4.conv1
          ratio: 0.35
      - type: ChannelPruning
        params:
          layer_name: layer3.5.conv1
          ratio: 0.35
    - name: prune_layer4_all_blocks
      mutations:
      - type: ChannelPruning
        params:
          layer_name: layer4.0.conv1
          ratio: 0.4
      - type: ChannelPruning
        params:
          layer_name: layer4.1.conv1
          ratio: 0.4
      - type: ChannelPruning
        params:
          layer_name: layer4.2.conv1
          ratio: 0.4
    - name: prune_layer4_conv3_expansion
      mutations:
      - type: ChannelPruning
        params:
          layer_name: layer4.0.conv3
          ratio: 0.3
      - type: ChannelPruning
        params:
          layer_name: layer4.1.conv3
          ratio: 0.3
      - type: ChannelPruning
        params:
          layer_name: layer4.2.conv3
          ratio: 0.3
    - name: prune_downsample_systematic
      mutations:
      - type: ChannelPruning
        params:
          layer_name: layer1.0.downsample.0
          ratio: 0.2
      - type: ChannelPruning
        params:
          layer_name: layer2.0.downsample.0
          ratio: 0.3
      - type: ChannelPruning
        params:
          layer_name: layer3.0.downsample.0
          ratio: 0.4
      - type: ChannelPruning
        params:
          layer_name: layer4.0.downsample.0
          ratio: 0.5
    - name: prune_layer1_systematic_indices
      mutations:
      - type: ChannelPruningByIndex
        params:
          layer_name: layer1.0.conv1
          prune_indices:
          - 0
          - 8
          - 16
          - 24
          - 32
          - 40
          - 48
          - 56
      - type: ChannelPruningByIndex
        params:
          layer_name: layer1.1.conv1
          prune_indices:
          - 4
          - 12
          - 20
          - 28
          - 36
          - 44
          - 52
          - 60
    - name: prune_layer2_pattern_indices
      mutations:
      - type: ChannelPruningByIndex
        params:
          layer_name: layer2.0.conv1
          prune_indices:
          - 0
          - 16
          - 32
          - 48
          - 64
          - 80
          - 96
          - 112
      - type: ChannelPruningByIndex
        params:
          layer_name: layer2.2.conv1
          prune_indices:
          - 8
          - 24
          - 40
          - 56
          - 72
          - 88
          - 104
          - 120
    - name: prune_layer3_deep_indices
      mutations:
      - type: ChannelPruningByIndex
        params:
          layer_name: layer3.0.conv1
          prune_indices:
          - 0
          - 32
          - 64
          - 96
          - 128
          - 160
          - 192
          - 224
      - type: ChannelPruningByIndex
        params:
          layer_name: layer3.3.conv1
          prune_indices:
          - 16
          - 48
          - 80
          - 112
          - 144
          - 176
          - 208
          - 240
      - type: ChannelPruningByIndex
        params:
          layer_name: layer3.5.conv1
          prune_indices:
          - 8
          - 40
          - 72
          - 104
          - 136
          - 168
          - 200
          - 232
    - name: prune_bn_layer1_pattern
      mutations:
      - type: ChannelPruning
        params:
          layer_name: layer1.0.bn1
          ratio: 0.1
      - type: ChannelPruning
        params:
          layer_name: layer1.0.bn3
          ratio: 0.15
      - type: ChannelPruning
        params:
          layer_name: layer1.1.bn1
          ratio: 0.1
      - type: ChannelPruning
        params:
          layer_name: layer1.1.bn3
          ratio: 0.15
    - name: prune_bn_layer2_systematic
      mutations:
      - type: ChannelPruning
        params:
          layer_name: layer2.0.bn2
          ratio: 0.2
      - type: ChannelPruning
        params:
          layer_name: layer2.1.bn2
          ratio: 0.2
      - type: ChannelPruning
        params:
          layer_name: layer2.2.bn2
          ratio: 0.2
      - type: ChannelPruning
        params:
          layer_name: layer2.3.bn2
          ratio: 0.2
    - name: prune_bn_layer3_deep
      mutations:
      - type: ChannelPruning
        params:
          layer_name: layer3.2.bn1
          ratio: 0.25
      - type: ChannelPruning
        params:
          layer_name: layer3.3.bn1
          ratio: 0.25
      - type: ChannelPruning
        params:
          layer_name: layer3.4.bn1
          ratio: 0.25
      - type: ChannelPruning
        params:
          layer_name: layer3.5.bn1
          ratio: 0.25
    - name: act_swap_relu_gelu
      mutations:
      - type: ActivationSwap
        params:
          target_func_name: relu
          new_func_name: gelu
    - name: act_swap_relu_swish
      mutations:
      - type: ActivationSwap
        params:
          target_func_name: relu
          new_func_name: swish
    - name: act_swap_relu_hardswish
      mutations:
      - type: ActivationSwap
        params:
          target_func_name: relu
          new_func_name: hardswish
    - name: act_swap_relu_leaky_relu
      mutations:
      - type: ActivationSwap
        params:
          target_func_name: relu
          new_func_name: leaky_relu
    - name: global_l1_prune_20
      mutations:
      - type: GlobalChannelPruning
        params:
          pruning_ratio: 0.2
          pruning_method: l1
    - name: global_l1_prune_35_exclude_stem_head
      mutations:
      - type: GlobalChannelPruning
        params:
          pruning_ratio: 0.35
          pruning_method: l1
          ignored_layers:
          - conv1
          - fc
    - name: global_l2_prune_30_layer34_only
      mutations:
      - type: GlobalChannelPruning
        params:
          pruning_ratio: 0.3
          pruning_method: l2
          layers_to_target:
          - layer3
          - layer4
    - name: global_random_prune_45
      mutations:
      - type: GlobalChannelPruning
        params:
          pruning_ratio: 0.45
          pruning_method: random
    - name: global_conservative_prune_25
      mutations:
      - type: GlobalChannelPruning
        params:
          pruning_ratio: 0.25
          pruning_method: l1
          ignored_layers:
          - conv1
          - layer1.0.downsample.0
          - fc
    - name: simple_intermediate_fc
      mutations:
      - type: AddIntermediateFCLayer
        params:
          hidden_size: 1024
          dropout_rate: 0.2
          activation: relu
    - name: dual_fc_layers
      mutations:
      - type: ReplaceFCStructure
        params:
          fc_structure:
          - 1024
          - 512
          dropout_rates:
          - 0.3
          - 0.2
          activations:
          - gelu
          - swish
    - name: complex_fc_structure
      mutations:
      - type: ReplaceFCStructure
        params:
          fc_structure:
          - 2048
          - 1024
          - 512
          - 256
          dropout_rates:
          - 0.3
          - 0.25
          - 0.2
          - 0.15
          activations:
          - relu
          - gelu
          - swish
          - relu
    - name: bottleneck_fc_structure
      mutations:
      - type: ReplaceFCStructure
        params:
          fc_structure:
          - 512
          - 1024
          - 512
          dropout_rates:
          - 0.3
          - 0.2
          - 0.3
          activations:
          - gelu
          - swish
          - gelu
    - name: light_combo_stem_layer1
      mutations:
      - type: ChannelPruning
        params:
          layer_name: conv1
          ratio: 0.15
      - type: ChannelPruning
        params:
          layer_name: layer1.0.conv1
          ratio: 0.1
      - type: ActivationSwap
        params:
          target_func_name: relu
          new_func_name: gelu
    - name: light_combo_layer2_focus
      mutations:
      - type: ChannelPruning
        params:
          layer_name: layer2.0.conv1
          ratio: 0.15
      - type: ChannelPruning
        params:
          layer_name: layer2.2.conv1
          ratio: 0.15
      - type: ActivationSwap
        params:
          target_func_name: relu
          new_func_name: swish
    - name: light_combo_downsample_optimization
      mutations:
      - type: ChannelPruning
        params:
          layer_name: layer2.0.downsample.0
          ratio: 0.2
      - type: ChannelPruning
        params:
          layer_name: layer3.0.downsample.0
          ratio: 0.25
      - type: ActivationSwap
        params:
          target_func_name: relu
          new_func_name: gelu
    - name: light_combo_kernel_prune
      mutations:
      - type: ConvKernelReplacement
        params:
          layer_name: layer1.0.conv2
          new_kernel:
          - 1
          - 1
          padding: 0
      - type: ChannelPruning
        params:
          layer_name: layer2.0.conv1
          ratio: 0.2
    - name: medium_combo_layer3_comprehensive
      mutations:
      - type: ChannelPruning
        params:
          layer_name: layer3.0.conv1
          ratio: 0.25
      - type: ChannelPruning
        params:
          layer_name: layer3.2.conv1
          ratio: 0.25
      - type: ChannelPruning
        params:
          layer_name: layer3.4.conv1
          ratio: 0.25
      - type: ActivationSwap
        params:
          target_func_name: relu
          new_func_name: gelu
    - name: medium_combo_bottleneck_pattern
      mutations:
      - type: ChannelPruning
        params:
          layer_name: layer1.0.conv3
          ratio: 0.2
      - type: ChannelPruning
        params:
          layer_name: layer2.0.conv3
          ratio: 0.25
      - type: ChannelPruning
        params:
          layer_name: layer3.0.conv3
          ratio: 0.3
      - type: ConvKernelReplacement
        params:
          layer_name: layer2.1.conv2
          new_kernel:
          - 1
          - 1
          padding: 0
    - name: medium_combo_global_plus_local
      mutations:
      - type: GlobalChannelPruning
        params:
          pruning_ratio: 0.3
          pruning_method: l1
          ignored_layers:
          - conv1
          - fc
      - type: ActivationSwap
        params:
          target_func_name: relu
          new_func_name: swish
      - type: AddIntermediateFCLayer
        params:
          hidden_size: 1024
          dropout_rate: 0.2
          activation: gelu
    - name: medium_combo_layer_balanced
      mutations:
      - type: ChannelPruning
        params:
          layer_name: layer1.2.conv1
          ratio: 0.15
      - type: ChannelPruning
        params:
          layer_name: layer2.3.conv1
          ratio: 0.2
      - type: ChannelPruning
        params:
          layer_name: layer3.5.conv1
          ratio: 0.3
      - type: ChannelPruning
        params:
          layer_name: layer4.2.conv1
          ratio: 0.35
    - name: heavy_combo_layer4_focus
      mutations:
      - type: ChannelPruning
        params:
          layer_name: layer4.0.conv1
          ratio: 0.4
      - type: ChannelPruning
        params:
          layer_name: layer4.1.conv1
          ratio: 0.4
      - type: ChannelPruning
