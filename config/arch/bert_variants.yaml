base_model_groups:
- base_model:
    name: bert-base-uncased
    pretrained: true
  single_variant_define:
  - name: bert_base_mobile_optimized
    variant_config:
      target_input_channels: 1
      target_output_classes: 2
      example_input_shape:
      - 1
      - 128
      run_training: true
      export_graph: false
      batch_size: 4
      training_measurement_min_seconds: 40.0
      use_fake_text_dataset: true
      use_real_text_dataset: true
      run_inference: true
      pre_inference_cooldown_seconds: 5.0
      inference_measurement_min_seconds: 40.0
    mutations:
    - type: TransformerLayerReduction
      params:
        target_layers: 6
        reduction_strategy: keep_early
    - type: HiddenSizeModification
      params:
        hidden_size: 384
    - type: AttentionHeadsModification
      params:
        num_heads: 6
    - type: IntermediateSizeModification
      params:
        intermediate_size: 1536
    - type: DropoutModification
      params:
        hidden_dropout_prob: 0.1
        attention_probs_dropout_prob: 0.1
  - name: bert_base_edge_device
    variant_config:
      target_input_channels: 1
      target_output_classes: 2
      example_input_shape:
      - 1
      - 64
      run_training: true
      export_graph: false
      batch_size: 4
      training_measurement_min_seconds: 40.0
      use_fake_text_dataset: true
      use_real_text_dataset: true
      run_inference: true
      pre_inference_cooldown_seconds: 5.0
      inference_measurement_min_seconds: 40.0
    mutations:
    - type: TransformerLayerReduction
      params:
        target_layers: 4
        reduction_strategy: keep_early
    - type: HiddenSizeModification
      params:
        hidden_size: 256
    - type: AttentionHeadsModification
      params:
        num_heads: 4
    - type: IntermediateSizeModification
      params:
        intermediate_size: 1024
    - type: PositionEncodingModification
      params:
        max_position_embeddings: 128
    - type: DropoutModification
      params:
        hidden_dropout_prob: 0.05
        attention_probs_dropout_prob: 0.05
  - name: bert_base_server_enhanced
    variant_config:
      target_input_channels: 1
      target_output_classes: 100
      example_input_shape:
      - 1
      - 256
      run_training: true
      export_graph: false
      batch_size: 4
      training_measurement_min_seconds: 40.0
      use_fake_text_dataset: true
      use_real_text_dataset: true
      run_inference: true
      pre_inference_cooldown_seconds: 5.0
      inference_measurement_min_seconds: 40.0
    mutations:
    - type: HiddenSizeModification
      params:
        hidden_size: 1024
    - type: AttentionHeadsModification
      params:
        num_heads: 16
    - type: IntermediateSizeModification
      params:
        intermediate_size: 4096
    - type: PositionEncodingModification
      params:
        max_position_embeddings: 512
    - type: DropoutModification
      params:
        hidden_dropout_prob: 0.15
        attention_probs_dropout_prob: 0.15
  combinatorial_variant_grid:
    input_channels:
    - 1
    output_classes:
    - 2
    - 10
    - 100
    base_variant_config_template:
      example_input_shape:
      - 1
