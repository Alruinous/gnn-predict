base_model_groups:
- base_model:
    name: vgg16
    pretrained: true
  single_variant_define:
  - name: vgg16_extreme_prune
    variant_config:
      target_input_channels: 3
      target_output_classes: 100
      example_input_shape:
      - 1
      - 3
      - 224
      - 224
      run_training: true
      export_onnx: false
      onnx_export_mode: architecture_only
      training_batch_sizes:
      - 16
      - 64
      - 128
      training_measurement_min_seconds: 40.0
      use_fake_imagenet: true
      run_inference: true
      pre_inference_cooldown_seconds: 5.0
      inference_measurement_min_seconds: 40.0
    mutations:
    - type: GlobalChannelPruning
      params:
        pruning_ratio: 0.7
        pruning_method: l1
    - type: ReplaceFCStructure
      params:
        fc_structure:
        - 512
        - 256
        dropout_rates:
        - 0.2
        - 0.1
        activations:
        - swish
        - swish
  - name: vgg16_mobile_optimized
    variant_config:
      target_input_channels: 3
      target_output_classes: 1000
      example_input_shape:
      - 1
      - 3
      - 224
      - 224
      run_training: true
      export_onnx: false
      onnx_export_mode: architecture_only
      training_batch_sizes:
      - 16
      - 64
      - 128
      training_measurement_min_seconds: 40.0
      use_fake_imagenet: true
      run_inference: true
      pre_inference_cooldown_seconds: 5.0
      inference_measurement_min_seconds: 40.0
    mutations:
    - type: ConvToDepthwiseSeparable
      params:
        layer_name: features.2
    - type: ConvToDepthwiseSeparable
      params:
        layer_name: features.5
    - type: ConvToDepthwiseSeparable
      params:
        layer_name: features.10
    - type: ReplaceFCStructure
      params:
        fc_structure:
        - 1024
        - 512
        dropout_rates:
        - 0.2
        - 0.1
        activations:
        - swish
        - gelu
    - type: ActivationSwap
      params:
        target_func_name: relu
        new_func_name: gelu
  combinatorial_variant_grid:
    input_channels:
    - 1
    - 3
    - 5
    - 7
    - 9
    output_classes:
    - 10
    - 100
    - 500
    base_variant_config_template:
      example_input_shape:
      - 1
      - 3
      - 224
      - 224
      export_onnx: false
      onnx_export_mode: architecture_only
      use_fake_imagenet: true
      run_training: true
      training_measurement_min_seconds: 40.0
      training_batch_sizes:
      - 16
      - 64
      - 128
      run_inference: true
      pre_inference_cooldown_seconds: 5.0
      inference_measurement_min_seconds: 40.0
    mutation_sets:
    - name: no_mutations
      mutations: []
    - name: prune_early_features_vgg16
      mutations:
      - type: ChannelPruning
        params:
          layer_name: features.0
          ratio: 0.2
      - type: ChannelPruning
        params:
          layer_name: features.2
          ratio: 0.15
    - name: prune_middle_features_vgg16
      mutations:
      - type: ChannelPruning
        params:
          layer_name: features.10
          ratio: 0.25
      - type: ChannelPruning
        params:
          layer_name: features.14
          ratio: 0.3
    - name: prune_deep_features_vgg16
      mutations:
      - type: ChannelPruning
        params:
          layer_name: features.24
          ratio: 0.35
      - type: ChannelPruning
        params:
          layer_name: features.28
          ratio: 0.4
    - name: global_light_prune_vgg16
      mutations:
      - type: GlobalChannelPruning
        params:
          pruning_ratio: 0.1
          pruning_method: l1
    - name: global_medium_prune_vgg16
      mutations:
      - type: GlobalChannelPruning
        params:
          pruning_ratio: 0.3
          pruning_method: l1
    - name: global_heavy_prune_vgg16
      mutations:
      - type: GlobalChannelPruning
        params:
          pruning_ratio: 0.5
          pruning_method: l1
    - name: global_prune_exclude_first_last_vgg16
      mutations:
      - type: GlobalChannelPruning
        params:
          pruning_ratio: 0.3
          pruning_method: l1
          ignored_layers:
          - features.0
          - head.fc
    - name: prune_by_index_vgg16
      mutations:
      - type: ChannelPruningByIndex
        params:
          layer_name: features.0
          prune_indices:
          - 0
          - 5
          - 10
          - 15
          - 20
          - 25
          - 30
      - type: ChannelPruningByIndex
        params:
          layer_name: features.10
          prune_indices:
          - 0
          - 25
          - 50
          - 75
          - 100
          - 125
    - name: prune_multiple_layers_by_index_vgg16
      mutations:
      - type: ChannelPruningByIndex
        params:
          layer_name: features.2
          prune_indices:
          - 0
          - 4
          - 8
          - 12
          - 16
          - 20
      - type: ChannelPruningByIndex
        params:
          layer_name: features.5
          prune_indices:
          - 10
          - 20
          - 30
          - 40
          - 50
    - name: conv_kernel_5x5_vgg16
      mutations:
      - type: ConvKernelReplacement
        params:
          layer_name: features.0
          new_kernel:
          - 5
          - 5
          padding: 2
    - name: conv_kernel_1x1_vgg16
      mutations:
      - type: ConvKernelReplacement
        params:
          layer_name: features.2
          new_kernel:
          - 1
          - 1
          padding: 0
    - name: multiple_kernel_changes_vgg16
      mutations:
      - type: ConvKernelReplacement
        params:
          layer_name: features.5
          new_kernel:
          - 5
          - 5
          padding: 2
      - type: ConvKernelReplacement
        params:
          layer_name: features.10
          new_kernel:
          - 1
          - 1
          padding: 0
    - name: deep_kernel_changes_vgg16
      mutations:
      - type: ConvKernelReplacement
        params:
          layer_name: features.24
          new_kernel:
          - 1
          - 1
          padding: 0
      - type: ConvKernelReplacement
        params:
          layer_name: features.26
          new_kernel:
          - 1
          - 1
          padding: 0
    - name: kernel_and_channel_pruning_vgg16
      mutations:
      - type: ConvKernelReplacement
        params:
          layer_name: features.0
          new_kernel:
          - 5
          - 5
          padding: 2
      - type: ChannelPruning
        params:
          layer_name: features.0
          ratio: 0.25
    - name: relu_to_leakyrelu_vgg16
      mutations:
      - type: ActivationSwap
        params:
          target_func_name: relu
          new_func_name: leaky_relu
    - name: relu_to_gelu_vgg16
      mutations:
      - type: ActivationSwap
        params:
          target_func_name: relu
          new_func_name: gelu
    - name: relu_to_swish_vgg16
      mutations:
      - type: ActivationSwap
        params:
          target_func_name: relu
          new_func_name: swish
    - name: thin_convmlp_vgg16
      mutations:
      - type: ReplaceFCStructure
        params:
          fc_structure:
          - 2048
          - 1024
          dropout_rates:
          - 0.3
          - 0.2
          activations:
          - relu
          - relu
    - name: wide_convmlp_vgg16
      mutations:
      - type: ReplaceFCStructure
        params:
          fc_structure:
          - 8192
          - 4096
          - 2048
          dropout_rates:
          - 0.4
          - 0.3
          - 0.2
          activations:
          - relu
          - gelu
          - relu
    - name: deep_convmlp_vgg16
      mutations:
      - type: ReplaceFCStructure
        params:
          fc_structure:
          - 4096
          - 2048
          - 1024
          - 512
          dropout_rates:
          - 0.4
          - 0.3
          - 0.2
          - 0.1
          activations:
          - relu
          - relu
          - gelu
          - swish
    - name: high_dropout_vgg16
      mutations:
      - type: ModifyDropout
        params:
          layer_name: pre_logits.drop
          new_p: 0.6
      - type: ModifyDropout
        params:
          layer_name: head.drop
          new_p: 0.5
    - name: low_dropout_vgg16
      mutations:
      - type: ModifyDropout
        params:
          layer_name: pre_logits.drop
          new_p: 0.2
      - type: ModifyDropout
        params:
          layer_name: head.drop
          new_p: 0.1
    - name: combined_light_mods_vgg16
      mutations:
      - type: ChannelPruning
        params:
          layer_name: features.10
          ratio: 0.15
      - type: ActivationSwap
        params:
          target_func_name: relu
          new_func_name: gelu
    - name: combined_medium_mods_vgg16
      mutations:
      - type: GlobalChannelPruning
        params:
          pruning_ratio: 0.2
          pruning_method: l1
      - type: ModifyDropout
        params:
          layer_name: pre_logits.drop
          new_p: 0.35
      - type: ActivationSwap
        params:
          target_func_name: relu
          new_func_name: swish
    - name: combined_heavy_mods_vgg16
      mutations:
      - type: GlobalChannelPruning
        params:
          pruning_ratio: 0.4
          pruning_method: l1
      - type: ReplaceFCStructure
        params:
          fc_structure:
          - 2048
          - 1024
          dropout_rates:
          - 0.4
          - 0.2
          activations:
          - gelu
          - swish
    - name: depthwise_separable_early_vgg16
      mutations:
      - type: ConvToDepthwiseSeparable
        params:
          layer_name: features.2
    - name: depthwise_separable_middle_vgg16
      mutations:
      - type: ConvToDepthwiseSeparable
        params:
          layer_name: features.10
    - name: depthwise_separable_multiple_vgg16
      mutations:
      - type: ConvToDepthwiseSeparable
        params:
          layer_name: features.5
      - type: ConvToDepthwiseSeparable
        params:
          layer_name: features.12
    - name: grouped_conv_vgg16
      mutations:
      - type: ConvToGroupedConv
        params:
          layer_name: features.10
          groups: 4
      - type: ConvToGroupedConv
        params:
          layer_name: features.17
          groups: 8
    - name: add_batchnorm_vgg16
      mutations:
      - type: AddNormalizationLayer
        params:
          after_layer_name: features.3
          norm_type: batch_norm
    - name: add_groupnorm_vgg16
      mutations:
      - type: AddNormalizationLayer
        params:
          after_layer_name: features.13
          norm_type: group_norm
          num_groups: 16
    - name: add_se_blocks_vgg16
      mutations:
      - type: AddSEBlock
        params:
          after_layer_name: features.9
          reduction_ratio: 16
      - type: AddSEBlock
        params:
          after_layer_name: features.16
          reduction_ratio: 16
