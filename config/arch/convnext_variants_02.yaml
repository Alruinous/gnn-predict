base_model_groups:
- base_model:
    name: convnext_atto
    pretrained: true
  combinatorial_variant_grid: &convnext_grid
    input_channels:
    - 3
    output_classes:
    - 20
    - 200
    - 1000
    base_variant_config_template: &convnext_template
      example_input_shape:
      - 1
      - 3
      - 224
      - 224
      export_onnx: true
      onnx_export_mode: architecture_only
      use_fake_imagenet: true
      run_training: true
      training_epochs: 30
      training_batch_sizes:
      - 8
      - 16
      - 32
      - 64
      fake_dataset_size: 32
      run_inference: true
      pre_inference_cooldown_seconds: 5.0
      inference_measurement_min_seconds: 60.0
    mutation_sets: &convnext_compact_mutations
    - name: no_mutations
      mutations: []
    - name: kernel_size_5
      mutations:
      - type: ConvNeXtKernelSizeModification
        params:
          kernel_size: 5
    - name: head_hidden_256
      mutations:
      - type: AddIntermediateFCLayer
        params:
          hidden_size: 256
          dropout_rate: 0.1
          activation: gelu
    - name: head_hidden_512
      mutations:
      - type: AddIntermediateFCLayer
        params:
          hidden_size: 512
          dropout_rate: 0.1
          activation: gelu
- base_model:
    name: convnext_pico
    pretrained: true
  combinatorial_variant_grid: *convnext_grid
- base_model:
    name: convnext_nano
    pretrained: true
  combinatorial_variant_grid: *convnext_grid
- base_model:
    name: convnext_tiny
    pretrained: true
  combinatorial_variant_grid: &convnext_linear_grid
    input_channels:
    - 3
    output_classes:
    - 20
    - 200
    - 1000
    base_variant_config_template: *convnext_template
    mutation_sets:
    - name: no_mutations
      mutations: []
    - name: mlp_expansion_2x
      mutations:
      - type: ConvNeXtMLPExpansionRatio
        params:
          expansion_ratio: 2.0
    - name: kernel_size_5
      mutations:
      - type: ConvNeXtKernelSizeModification
        params:
          kernel_size: 5
    - name: head_hidden_512
      mutations:
      - type: AddIntermediateFCLayer
        params:
          hidden_size: 512
          dropout_rate: 0.1
          activation: gelu
- base_model:
    name: convnext_small
    pretrained: true
  combinatorial_variant_grid: *convnext_linear_grid
