base_model_groups:
- base_model:
    name: densenetblur121d
    pretrained: true
  combinatorial_variant_grid: &densenet_grid
    input_channels:
    - 3
    output_classes:
    - 20
    - 200
    - 1000
    base_variant_config_template: &densenet_template
      example_input_shape:
      - 1
      - 3
      - 224
      - 224
      export_onnx: true
      onnx_export_mode: architecture_only
      use_fake_imagenet: true
      run_training: true
      training_epochs: 30
      training_batch_sizes:
      - 8
      - 16
      - 32
      - 64
      fake_dataset_size: 32
      run_inference: true
      pre_inference_cooldown_seconds: 5.0
      inference_measurement_min_seconds: 60.0
    mutation_sets: &densenet_mutations
    - name: no_mutations
      mutations: []
    - name: head_hidden_512
      mutations:
      - type: AddIntermediateFCLayer
        params:
          hidden_size: 512
          dropout_rate: 0.1
          activation: relu
    - name: head_hidden_1024
      mutations:
      - type: AddIntermediateFCLayer
        params:
          hidden_size: 1024
          dropout_rate: 0.1
          activation: relu
    - name: head_pyramid_1024_256
      mutations:
      - type: ReplaceFCStructure
        params:
          fc_structure:
          - 1024
          - 256
          dropout_rates:
          - 0.15
          - 0.1
          activations:
          - relu
          - gelu
- base_model:
    name: densenet169
    pretrained: true
  combinatorial_variant_grid: *densenet_grid
- base_model:
    name: densenet201
    pretrained: true
  combinatorial_variant_grid: *densenet_grid
- base_model:
    name: densenet161
    pretrained: true
  combinatorial_variant_grid: *densenet_grid
