# YOLOv10 variant configurations
# 6 base_model_groups × 3 output_classes × 13 mutation_sets = 234 variants

base_model_groups:
# ===== 6 native scales =====
- base_model:
    name: yolov10n
    pretrained: false
  combinatorial_variant_grid: &yolov10_grid
    input_channels:
    - 3
    output_classes:
    - 10
    - 50
    - 80
    base_variant_config_template: &yolov10_tpl
      example_input_shape:
      - 1
      - 3
      - 640
      - 640
      export_onnx: true
      onnx_export_mode: architecture_only
      run_training: true
      training_measurement_min_seconds: 30.0
      training_batch_sizes:
      - 4
      - 8
      - 16
      use_fake_imagenet: true
      run_inference: true
      inference_measurement_min_seconds: 40.0
      pre_inference_cooldown_seconds: 5.0
    mutation_sets: &yolov10_mutations
      # --- baseline ---
      - name: baseline
        mutations: []
      # --- head module replace (1) ---
      - name: head_c2fcib_to_c2f
        mutations:
        - type: HeadModuleReplace
          params:
            from_module: C2fCIB
            to_module: C2f
      # --- activation override (3) ---
      - name: activation_relu
        mutations:
        - type: ActivationOverride
          params:
            activation: nn.ReLU()
      - name: activation_gelu
        mutations:
        - type: ActivationOverride
          params:
            activation: nn.GELU()
      - name: activation_silu
        mutations:
        - type: ActivationOverride
          params:
            activation: nn.SiLU()
      # --- SPPF kernel replace (2) ---
      - name: sppf_kernel_3
        mutations:
        - type: SPPFKernelReplace
          params:
            kernel_size: 3
      - name: sppf_kernel_7
        mutations:
        - type: SPPFKernelReplace
          params:
            kernel_size: 7
      # --- backbone depth override (1) ---
      - name: depth_repeat_3
        mutations:
        - type: BackboneDepthOverride
          params:
            repeat_value: 3
      # --- channel scale (2) ---
      - name: channel_scale_075
        mutations:
        - type: ChannelScale
          params:
            scale_factor: 0.75
      - name: channel_scale_125
        mutations:
        - type: ChannelScale
          params:
            scale_factor: 1.25
      # --- binary combinations (2) ---
      - name: combo2_head_c2f_relu
        mutations:
        - type: HeadModuleReplace
          params:
            from_module: C2fCIB
            to_module: C2f
        - type: ActivationOverride
          params:
            activation: nn.ReLU()
      - name: combo2_gelu_scale075
        mutations:
        - type: ActivationOverride
          params:
            activation: nn.GELU()
        - type: ChannelScale
          params:
            scale_factor: 0.75
      # --- ternary combination (1) ---
      - name: combo3_head_c2f_silu_sppf7
        mutations:
        - type: HeadModuleReplace
          params:
            from_module: C2fCIB
            to_module: C2f
        - type: ActivationOverride
          params:
            activation: nn.SiLU()
        - type: SPPFKernelReplace
          params:
            kernel_size: 7

- base_model:
    name: yolov10s
    pretrained: false
  combinatorial_variant_grid: *yolov10_grid

- base_model:
    name: yolov10m
    pretrained: false
  combinatorial_variant_grid: *yolov10_grid

- base_model:
    name: yolov10b
    pretrained: false
  combinatorial_variant_grid: *yolov10_grid

- base_model:
    name: yolov10l
    pretrained: false
  combinatorial_variant_grid: *yolov10_grid

- base_model:
    name: yolov10x
    pretrained: false
  combinatorial_variant_grid: *yolov10_grid
