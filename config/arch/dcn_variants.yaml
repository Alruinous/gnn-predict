base_model_groups:
- base_model:
    name: dcn
    pretrained: false
  variant_config_grid:
    base_variant_config_template: &dcn_base_variant
      target_output_classes: 1
      example_input_shape:
      - 2048
      run_training: true
      run_inference: true
      pre_inference_cooldown_seconds: 5.0
      inference_measurement_min_seconds: 40.0
      export_onnx: true
      onnx_export_mode: architecture_only
      training_batch_sizes:
      - 2048
      training_measurement_min_seconds: 40.0
      use_fake_recommender_dataset: true
      dcn_config:
        sparse_features: &dcn_sparse_f32_e384
        - {name: user_id, vocab_size: 100000, embed_dim: 384}
        - {name: item_id, vocab_size: 200000, embed_dim: 384}
        - {name: category_id, vocab_size: 10000, embed_dim: 384}
        - {name: brand_id, vocab_size: 50000, embed_dim: 384}
        - {name: shop_id, vocab_size: 40000, embed_dim: 384}
        - {name: region_id, vocab_size: 1024, embed_dim: 384}
        - {name: device_type, vocab_size: 64, embed_dim: 384}
        - {name: hour_bucket, vocab_size: 24, embed_dim: 384}
        - {name: campaign_id, vocab_size: 50000, embed_dim: 384}
        - {name: query_token_id, vocab_size: 100000, embed_dim: 384}
        - {name: ad_slot_id, vocab_size: 2048, embed_dim: 384}
        - {name: creative_id, vocab_size: 100000, embed_dim: 384}
        - {name: seller_id, vocab_size: 80000, embed_dim: 384}
        - {name: page_section, vocab_size: 1024, embed_dim: 384}
        - {name: price_bucket, vocab_size: 512, embed_dim: 384}
        - {name: user_segment, vocab_size: 4096, embed_dim: 384}
        - {name: merchant_id, vocab_size: 120000, embed_dim: 384}
        - {name: coupon_id, vocab_size: 20000, embed_dim: 384}
        - {name: city_id, vocab_size: 8192, embed_dim: 384}
        - {name: os_id, vocab_size: 128, embed_dim: 384}
        - {name: network_type, vocab_size: 64, embed_dim: 384}
        - {name: scene_id, vocab_size: 1024, embed_dim: 384}
        - {name: channel_id, vocab_size: 512, embed_dim: 384}
        - {name: experiment_bucket, vocab_size: 256, embed_dim: 384}
        - {name: interest_cluster, vocab_size: 65536, embed_dim: 384}
        - {name: poi_id, vocab_size: 200000, embed_dim: 384}
        - {name: author_id, vocab_size: 180000, embed_dim: 384}
        - {name: content_topic, vocab_size: 32768, embed_dim: 384}
        - {name: supply_bucket, vocab_size: 4096, embed_dim: 384}
        - {name: member_level, vocab_size: 128, embed_dim: 384}
        - {name: risk_bucket, vocab_size: 512, embed_dim: 384}
        - {name: campaign_group, vocab_size: 65536, embed_dim: 384}
        dense_features: &dcn_dense16
        - {name: user_age_score}
        - {name: item_price_score}
        - {name: recency_score}
        - {name: seller_quality_score}
        - {name: ctr_prior_score}
        - {name: context_score}
        - {name: freshness_score}
        - {name: position_score}
        - {name: discount_score}
        - {name: quality_score}
        - {name: delivery_score}
        - {name: seasonality_score}
        - {name: inventory_score}
        - {name: rank_score}
        - {name: user_value_score}
        - {name: merchant_score}
        mlp_dims: &dcn_mlp6144
        - 6144
        - 3072
        - 1536
        activation: relu
        dropout: 0.0
        n_cross_layers: 14
    axes:
    - name: feature
