base_model_groups:
- base_model:
    name: deepfm
    pretrained: false
  variant_config_grid:
    base_variant_config_template:
      target_output_classes: 1
      example_input_shape:
      - 2
      run_training: true
      run_inference: true
      pre_inference_cooldown_seconds: 5.0
      inference_measurement_min_seconds: 40.0
      export_onnx: true
      onnx_export_mode: architecture_only
      training_batch_sizes:
      - 2
      training_measurement_min_seconds: 40.0
      use_fake_recommender_dataset: true
      deepfm_config:
        sparse_features:
        - name: user_id
          vocab_size: 64
          embed_dim: 4
        - name: item_id
          vocab_size: 128
          embed_dim: 4
        - name: device_type
          vocab_size: 8
          embed_dim: 4
        - name: category_id
          vocab_size: 32
          embed_dim: 4
        dense_features:
        - name: user_age_score
        - name: item_price_score
        mlp_dims:
        - 16
        - 8
        activation: relu
        dropout: 0.0
        fm_feature_names:
        - user_id
        - item_id
    axes:
    - name: feature
      values:
      - name: tiny
        overrides:
          deepfm_config.sparse_features:
          - name: user_id
            vocab_size: 64
            embed_dim: 4
          - name: item_id
            vocab_size: 128
            embed_dim: 4
          - name: device_type
            vocab_size: 8
            embed_dim: 4
          - name: category_id
            vocab_size: 32
            embed_dim: 4
          deepfm_config.dense_features:
          - name: user_age_score
          - name: item_price_score
      - name: small
        overrides:
          deepfm_config.sparse_features:
          - name: user_id
            vocab_size: 256
            embed_dim: 8
          - name: item_id
            vocab_size: 512
            embed_dim: 8
          - name: device_type
            vocab_size: 12
            embed_dim: 8
          - name: category_id
            vocab_size: 96
            embed_dim: 8
          - name: region_id
            vocab_size: 64
            embed_dim: 8
          deepfm_config.dense_features:
          - name: user_age_score
          - name: item_price_score
          - name: recency_score
      - name: medium
        overrides:
          deepfm_config.sparse_features:
          - name: user_id
            vocab_size: 1024
            embed_dim: 16
          - name: item_id
            vocab_size: 2048
            embed_dim: 16
          - name: device_type
            vocab_size: 16
            embed_dim: 16
          - name: category_id
            vocab_size: 256
            embed_dim: 16
          - name: region_id
            vocab_size: 128
            embed_dim: 16
          - name: hour_bucket
            vocab_size: 24
            embed_dim: 16
          - name: campaign_id
            vocab_size: 512
            embed_dim: 16
          deepfm_config.dense_features:
          - name: user_age_score
          - name: item_price_score
          - name: recency_score
          - name: engagement_vector
            embed_dim: 4
      - name: large
        overrides:
          deepfm_config.sparse_features:
          - name: user_id
            vocab_size: 4096
            embed_dim: 32
          - name: item_id
            vocab_size: 8192
            embed_dim: 32
          - name: device_type
            vocab_size: 24
            embed_dim: 32
          - name: category_id
            vocab_size: 512
            embed_dim: 32
          - name: region_id
            vocab_size: 256
            embed_dim: 32
          - name: hour_bucket
            vocab_size: 24
            embed_dim: 32
          - name: campaign_id
            vocab_size: 1024
            embed_dim: 32
          - name: query_token_id
            vocab_size: 2048
            embed_dim: 32
          - name: ad_slot_id
            vocab_size: 64
            embed_dim: 32
          deepfm_config.dense_features:
          - name: user_age_score
          - name: item_price_score
          - name: recency_score
          - name: seller_quality_score
          - name: engagement_vector
            embed_dim: 4
          - name: context_vector
            embed_dim: 8
    - name: mlp
      values:
      - name: mlp16x8
        overrides:
          deepfm_config.mlp_dims:
          - 16
          - 8
      - name: mlp32x16
        overrides:
          deepfm_config.mlp_dims:
          - 32
          - 16
      - name: mlp64x32
        overrides:
          deepfm_config.mlp_dims:
          - 64
          - 32
      - name: mlp128x64
        overrides:
          deepfm_config.mlp_dims:
          - 128
          - 64
      - name: mlp128x64x32
        overrides:
          deepfm_config.mlp_dims:
          - 128
          - 64
          - 32
    - name: activation
      values:
      - name: relu
        overrides:
          deepfm_config.activation: relu
      - name: prelu
        overrides:
          deepfm_config.activation: prelu
    - name: dropout
      values:
      - name: drop0
        overrides:
          deepfm_config.dropout: 0.0
      - name: drop0p1
        overrides:
          deepfm_config.dropout: 0.1
    - name: fm
      values:
      - name: fm_pair
        overrides:
          deepfm_config.fm_feature_names:
          - user_id
          - item_id
      - name: fm_triple
        overrides:
          deepfm_config.fm_feature_names:
          - user_id
          - item_id
          - device_type
      - name: fm_quad
        overrides:
          deepfm_config.fm_feature_names:
          - user_id
          - item_id
          - device_type
          - category_id
    - name: batch
      values:
      - name: bs2
        overrides:
          example_input_shape:
          - 2
          training_batch_sizes:
          - 2
      - name: bs8
        overrides:
          example_input_shape:
          - 8
          training_batch_sizes:
          - 8
    mutations: []
