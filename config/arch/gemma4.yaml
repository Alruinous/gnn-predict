# Comment A100-only groups before V100 runs because --gpu_node does not filter variants.
# Gemma4 h5120_l40 is omitted because the measured PT2 peak/weight ratio predicts over 40GB.
base_model_groups:
# V100/A100: compact full-flow variants.
- base_model:
    name: gemma4
    pretrained: false
  variant_config_grid:
    base_variant_config_template:
      example_input_shape:
      - 1
      - 128
      run_training: false
      run_inference: false
      run_prefill: true
      run_decode: true
      pre_inference_cooldown_seconds: 5.0
      pre_prefill_cooldown_seconds: 5.0
      pre_decode_cooldown_seconds: 5.0
      inference_measurement_min_seconds: 40.0
      prefill_measurement_min_seconds: 40.0
      decode_measurement_min_seconds: 40.0
      decode_max_output_length: 32
      export_graph: true
      batch_size: 1
      training_measurement_min_seconds: 40.0
      use_fake_text_dataset: true
      gemma4_config:
        vocab_size: 262144
        hidden_size: 768
        intermediate_size: 3072
        num_hidden_layers: 16
        num_attention_heads: 6
        num_key_value_heads: 3
        head_dim: 256
        max_position_embeddings: 131072
        tie_word_embeddings: true
        sliding_window: 512
    axes:
    - name: arch
      values:
      - name: h768_l16
        overrides:
          gemma4_config.hidden_size: 768
      - name: h1024_l20
        overrides:
          gemma4_config.hidden_size: 1024
          gemma4_config.intermediate_size: 4096
          gemma4_config.num_hidden_layers: 20
          gemma4_config.num_attention_heads: 8
          gemma4_config.num_key_value_heads: 4
      - name: h1280_l24
        overrides:
          gemma4_config.hidden_size: 1280
          gemma4_config.intermediate_size: 5120
          gemma4_config.num_hidden_layers: 24
          gemma4_config.num_attention_heads: 8
          gemma4_config.num_key_value_heads: 4
    - name: shape
      values:
      - name: bs1_s128
        overrides:
          example_input_shape:
          - 1
          - 128
          batch_size: 1
      - name: bs1_s256
        overrides:
          example_input_shape:
          - 1
          - 256
          batch_size: 1
      - name: bs1_s512
        overrides:
          example_input_shape:
          - 1
          - 512
          batch_size: 1
      - name: bs2_s128
        overrides:
          example_input_shape:
          - 2
          - 128
          batch_size: 2
      - name: bs2_s256
        overrides:
          example_input_shape:
          - 2
          - 256
          batch_size: 2
      - name: bs4_s128
        overrides:
          example_input_shape:
          - 4
          - 128
          batch_size: 4
