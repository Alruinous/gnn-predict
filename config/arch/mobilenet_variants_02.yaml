base_model_groups:
- base_model:
    name: mobilenetv2_035
    pretrained: true
  combinatorial_variant_grid: &mobilenet_grid
    input_channels:
    - 3
    output_classes:
    - 20
    - 200
    - 1000
    base_variant_config_template: &mobilenet_template
      example_input_shape:
      - 1
      - 3
      - 224
      - 224
      export_onnx: true
      onnx_export_mode: architecture_only
      use_fake_imagenet: true
      run_training: true
      training_epochs: 30
      training_batch_sizes:
      - 8
      - 16
      - 32
      - 64
      fake_dataset_size: 32
      run_inference: true
      pre_inference_cooldown_seconds: 5.0
      inference_measurement_min_seconds: 60.0
    mutation_sets: &mobilenet_mutations
    - name: no_mutations
      mutations: []
    - name: head_hidden_128
      mutations:
      - type: AddIntermediateFCLayer
        params:
          hidden_size: 128
          dropout_rate: 0.1
          activation: relu
    - name: head_hidden_256
      mutations:
      - type: AddIntermediateFCLayer
        params:
          hidden_size: 256
          dropout_rate: 0.1
          activation: relu
    - name: head_pyramid_512_128
      mutations:
      - type: ReplaceFCStructure
        params:
          fc_structure:
          - 512
          - 128
          dropout_rates:
          - 0.15
          - 0.1
          activations:
          - relu
          - relu
- base_model:
    name: mobilenetv2_050
    pretrained: true
  combinatorial_variant_grid: *mobilenet_grid
- base_model:
    name: mobilenetv2_075
    pretrained: true
  combinatorial_variant_grid: *mobilenet_grid
- base_model:
    name: mobilenetv2_140
    pretrained: true
  combinatorial_variant_grid: *mobilenet_grid
- base_model:
    name: mobilenetv3_small_050
    pretrained: true
  combinatorial_variant_grid: *mobilenet_grid
- base_model:
    name: mobilenetv3_small_100
    pretrained: true
  combinatorial_variant_grid: *mobilenet_grid
- base_model:
    name: mobilenetv3_large_075
    pretrained: true
  combinatorial_variant_grid: *mobilenet_grid
- base_model:
    name: mobilenetv3_large_100
    pretrained: true
  combinatorial_variant_grid: *mobilenet_grid
