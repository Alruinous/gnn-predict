    "pandas>=2.3.3",
    "pathlib>=1.0.1",
    "plotly>=6.3.1",
    "prometheus-api-client>=0.6.0",
    "pynvml>=13.0.1",
    "pydantic>=2.11.3",
    "pyyaml>=6.0.3",
    "ruff>=0.15.7",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
    "timm>=1.0.20",
    "torch==2.9.0",
